<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Passion to Perfection — Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,500;1,600;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    /* Puff 'n Stuff brand palette (sampled from the Passion to Perfection deck) */
    --paper:#FEFFF9; --ink:#141310; --frame:#111010; --charcoal:#424242;
    --surround:#3B3B3B; --muted:#6A6A66; --hair:#E3E3E0; --panel:#FFFFFF;
    --soft:#F2F2F1; --soft2:#ECECEA; --hatchA:#F0F0EF; --hatchB:#E5E5E3;
    --buffet:#1800AD; --displayed:#7ED957; --chef:#FF3131; --dessert:#38B6FF;
    --coffee:#E2A9F1; --beverage:#5170FF; --bar:#FF751F; --place:#A6A6A6;
    --verified:#2E7D46; --review:#B9791A; --tbd:#8A8378; --gold:#B8912E;
    --serif:"Playfair Display",Georgia,"Times New Roman",serif;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--surround);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;}
  .phone{max-width:464px;margin:0 auto;min-height:100vh;background:var(--paper);
    box-shadow:0 0 46px rgba(0,0,0,.22);display:flex;flex-direction:column;position:relative;}

  /* Decorative black frame with corner accents */
  .frame{position:fixed;pointer-events:none;z-index:30;top:8px;bottom:8px;
    left:max(8px,calc(50% - 232px + 8px));right:max(8px,calc(50% - 232px + 8px));
    border:2.5px solid var(--frame);}
  .frame::before,.frame::after{content:"";position:absolute;width:20px;height:20px;}
  .corner{position:absolute;width:16px;height:16px;border:0;}
  .corner i{position:absolute;inset:0;}
  .corner i::before,.corner i::after{content:"";position:absolute;background:var(--frame);}
  .corner i::before{width:16px;height:1.5px;top:7px;left:0;transform:rotate(45deg);}
  .corner i::after{width:16px;height:1.5px;top:7px;left:0;transform:rotate(-45deg);}
  .c-tl{top:3px;left:3px}.c-tr{top:3px;right:3px}.c-bl{bottom:3px;left:3px}.c-br{bottom:3px;right:3px}

  /* Top bar */
  .topbar{position:sticky;top:0;z-index:20;background:var(--paper);
    border-bottom:2px solid var(--frame);display:flex;align-items:center;gap:11px;
    padding:11px 16px;min-height:58px;}
  .back{border:2px solid var(--frame);background:var(--paper);width:38px;height:38px;
    font-family:var(--serif);font-size:22px;line-height:1;cursor:pointer;display:none;
    align-items:center;justify-content:center;flex:none;color:var(--ink);}
  .back.show{display:flex;}
  .wm{font-family:var(--serif);line-height:1;}
  .wm .a{font-size:15px;font-weight:700;letter-spacing:.3px;}
  .wm .b{font-size:15px;font-weight:700;letter-spacing:.3px;margin-left:16px;position:relative;}
  .wm .b::before{content:"";position:absolute;left:-13px;top:-7px;width:9px;height:8px;
    border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);}
  .crumb{margin-left:auto;font-size:9.5px;letter-spacing:2px;text-transform:uppercase;
    color:var(--muted);text-align:right;font-weight:600;}
  .wmimg{height:34px;width:auto;display:block;}
  .lklogo{display:block;width:260px;max-width:78%;height:auto;margin:8px auto 4px;}
  .modref{border:2px solid var(--frame);background:var(--soft);padding:12px 14px;margin:14px 0 6px;}
  .modrefh{font-family:var(--serif);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px;}
  .modrefn{font-size:12.5px;color:#34302b;margin-bottom:9px;line-height:1.45;}

  #adminov{position:fixed;inset:0;z-index:100;background:var(--paper);display:none;flex-direction:column;}
  .admbar{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;background:var(--charcoal);color:#fff;font-family:var(--serif);font-weight:800;font-size:15px;}
  .admbar button{background:none;border:1.5px solid #6f6f6f;color:#fff;padding:6px 13px;font-size:12px;cursor:pointer;font-family:var(--sans);font-weight:700;}
  #admframe{border:0;flex:1;width:100%;}
  .previewnote{background:var(--charcoal);color:#f2eee4;font-size:10.5px;line-height:1.45;
    padding:8px 16px;text-align:center;letter-spacing:.3px;}
  .previewnote b{color:#FEFFF9;}
  .viewbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#efe9d9;border-bottom:2px solid var(--frame);padding:7px 14px;font-size:11px;font-weight:600;color:#5c574c;}
  .viewbar select{font-family:var(--sans);font-size:12px;font-weight:700;border:1.5px solid var(--frame);background:var(--paper);color:var(--ink);padding:3px 7px;}
  .viewbar .vbnote{color:var(--muted);font-weight:400;font-style:italic;font-size:10px;}
  .tile.locked{background:var(--soft);border-style:dashed;border-color:#BFBDB6;cursor:default;color:var(--muted);}
  .tile.locked .tt{color:var(--muted);}
  .lockmk{align-self:flex-start;font-size:14px;opacity:.6;}

  .screen{padding:20px 18px 26px;flex:1;animation:fade .18s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* Full wordmark lockup w/ stepped arrow */
  .lockup{text-align:center;margin:6px 0 4px;}
  .lockup .lk{display:inline-block;position:relative;text-align:left;font-family:var(--serif);}
  .lockup .p1{font-size:30px;font-weight:700;line-height:1;}
  .lockup .p2{font-size:30px;font-weight:700;line-height:1;margin-left:44px;margin-top:3px;}
  .lockup svg{position:absolute;left:6px;top:32px;width:150px;height:26px;overflow:visible;}
  .lockup .tag{display:block;text-align:center;font-family:var(--serif);font-style:italic;
    font-weight:500;font-size:14px;color:#4a463d;margin-top:10px;letter-spacing:.3px;}

  .kicker{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--muted);
    text-align:center;margin:14px 0 2px;}
  h1.disp{font-family:var(--serif);font-weight:800;font-size:25px;line-height:1.15;
    text-align:center;margin:2px 0 6px;letter-spacing:.2px;}
  .lead{color:var(--muted);font-size:13.5px;line-height:1.55;text-align:center;
    max-width:340px;margin:8px auto 4px;}

  /* Section title block (solid color, black border, bold serif) */
  .titleblock{border:2.5px solid var(--frame);background:var(--tbcolor,#eee);
    padding:11px 14px;margin:0;display:flex;align-items:center;gap:12px;}
  .titleblock .tbtext{font-family:var(--serif);font-weight:800;text-transform:uppercase;
    font-size:20px;letter-spacing:.5px;color:#151312;line-height:1.05;}
  .titleblock .tbtext small{display:block;font-size:11px;font-weight:600;letter-spacing:1px;
    text-transform:none;font-family:var(--sans);color:#2c2823;margin-top:2px;font-style:normal;}
  .diamond{width:17px;height:17px;background:var(--dc,#999);border:2px solid var(--frame);
    transform:rotate(45deg);flex:none;}

  /* Path nodes (home) */
  .arc{display:flex;flex-direction:column;gap:11px;margin-top:20px;}
  .node{border:2.5px solid var(--frame);background:var(--panel);padding:15px 15px;
    display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .12s;}
  .node:active{transform:scale(.985);}
  .node{box-shadow:inset 6px 0 0 var(--nc,transparent);}
  .node .num{font-family:var(--serif);font-style:italic;font-size:23px;font-weight:700;
    width:32px;text-align:center;flex:none;color:var(--nc,var(--ink));}
  .tile.active{box-shadow:inset 6px 0 0 var(--tc,transparent);}
  .greet{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--ink);text-align:center;margin:6px 0 4px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
  .greet .grex{font-size:9px;color:var(--muted);border:1px solid var(--hair);border-radius:50%;width:15px;height:15px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-family:var(--sans);}
  .greet .nameinput{font-family:var(--sans);font-size:13px;font-weight:400;border:1.5px solid var(--frame);background:var(--paper);padding:5px 9px;width:150px;}
  .greet .nameinput:focus{outline:none;box-shadow:2px 2px 0 var(--frame);}
  .prog{display:flex;align-items:center;gap:13px;border:2px solid var(--frame);background:var(--panel);padding:11px 13px;margin:12px 0 8px;cursor:pointer;}
  .prog.start{border-style:dashed;}
  .ringsvg{width:56px;height:56px;flex:none;}
  .ringpct{font-family:var(--serif);font-weight:800;font-size:16px;fill:var(--ink);}
  .progtext .pk{font-family:var(--serif);font-size:9.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}
  .progtext .pn{font-family:var(--serif);font-weight:800;font-size:15px;margin:2px 0;line-height:1.15;}
  .progtext .ps{font-size:11.5px;color:var(--muted);}
  .homerec{border:2px solid var(--frame);border-left:6px solid var(--displayed);background:var(--panel);padding:11px 14px;margin-top:12px;cursor:pointer;}
  .homerec .hrk{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#1e7a3a;}
  .homerec .hrt{font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.4;margin:5px 0;}
  .homerec .hrn{font-family:var(--serif);font-weight:800;font-size:13px;}
  .homerec.foryou{border-left-color:var(--bar);background:linear-gradient(0deg,#fff6ec,#fffdf8);}
  .homerec.foryou .hrk{color:#b8641a;}
  .prog.nudge{border-color:var(--bar);box-shadow:inset 0 0 0 1px var(--bar);}
  .milecard{display:flex;align-items:center;gap:11px;border:2px solid var(--frame);background:linear-gradient(0deg,#fdf4e6,#fffdf7);padding:11px 13px;margin:8px 0 2px;position:relative;}
  .milecard .mie{font-size:26px;flex:none;}
  .milecard .mit{font-family:var(--serif);font-weight:800;font-size:15px;}
  .milecard .mis{font-size:12px;color:var(--muted);line-height:1.35;}
  .milecard .milesample{position:absolute;top:6px;right:8px;font-size:8px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);border:1px solid var(--hair);padding:1px 5px;}
  .node .nt{font-family:var(--serif);font-size:19px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;}
  .node .ns{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .node .go{margin-left:auto;font-family:var(--serif);font-size:24px;flex:none;}
  .node.active{box-shadow:5px 5px 0 var(--frame);}
  .node.planned{background:repeating-linear-gradient(45deg,var(--hatchA),var(--hatchA) 7px,var(--hatchB) 7px,var(--hatchB) 14px);
    border-style:dashed;cursor:default;}
  .node.planned .nt,.node.planned .num{color:#5c574c;}

  /* Badges */
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:700;
    letter-spacing:1px;text-transform:uppercase;padding:3.5px 8px;border:1.5px solid;
    white-space:nowrap;font-family:var(--sans);}
  .b-plan{color:var(--muted);border-color:#BFBDB6;background:#fff;}
  .b-active{color:#fff;border-color:var(--charcoal);background:var(--charcoal);}
  .b-verified{color:#fff;border-color:var(--frame);background:var(--frame);}
  .b-review{color:#2b2926;border-color:#2b2926;background:#fff;}
  .b-tbd{color:var(--muted);border-color:#BFBDB6;background:var(--soft);}
  .mini{margin-left:auto;flex:none;}

  /* Craft grid */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px;}
  .tile{border:2.5px solid var(--frame);background:var(--panel);padding:13px;min-height:92px;
    display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;position:relative;
    transition:transform .12s;}
  .tile:active{transform:scale(.98);}
  .tile .tt{font-family:var(--serif);font-size:16px;font-weight:800;letter-spacing:.2px;}
  .tile .td{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.35;}
  .tile.active{box-shadow:4px 4px 0 var(--frame);}
  .tile.planned{background:repeating-linear-gradient(45deg,var(--hatchA),var(--hatchA) 7px,var(--hatchB) 7px,var(--hatchB) 14px);
    border-style:dashed;cursor:default;}
  .tile.planned .tt{color:#5c574c;}
  .tile .badge{align-self:flex-start;margin-top:8px;}

  /* Station list rows */
  .cathead{display:flex;align-items:center;gap:10px;margin:24px 0 11px;}
  .cathead .catname{font-family:var(--serif);font-size:13px;font-weight:800;letter-spacing:2px;
    text-transform:uppercase;}
  .row{border:2.5px solid var(--frame);background:var(--panel);padding:0;margin-bottom:11px;
    display:flex;align-items:stretch;cursor:pointer;transition:transform .12s;overflow:hidden;}
  .row:active{transform:scale(.99);}
  .row .cbar{width:12px;flex:none;background:var(--rc);border-right:2px solid var(--frame);}
  .row .rin{padding:12px 14px;display:flex;align-items:center;gap:12px;flex:1;}
  .row .rt{font-family:var(--serif);font-size:16px;font-weight:800;line-height:1.15;}
  .row .rd{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.35;}
  .row .go{margin-left:auto;font-family:var(--serif);font-size:22px;flex:none;color:var(--muted);}

  /* Station detail */
  .photoph{border:2.5px solid var(--frame);background:var(--soft2);height:158px;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);
    text-align:center;padding:10px;margin-top:0;border-top:none;}
  .photoph .ic{font-size:30px;opacity:.5;}
  .photoph .t1{font-family:var(--serif);font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;}
  .photoph .t2{font-size:10.5px;}
  /* Photo gallery (swipe / scroll multiple photos) */
  .gallery{position:relative;}
  .gtrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border:2.5px solid var(--frame);-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .gtrack::-webkit-scrollbar{display:none;}
  .gslide{min-width:100%;scroll-snap-align:center;position:relative;flex:none;}
  .gslide img{width:100%;height:auto;display:block;}
  .gslide.gph{height:196px;background:var(--soft2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);text-align:center;padding:12px;}
  .gslide .ic{font-size:30px;opacity:.5;}
  .gslide .t1{font-family:var(--serif);font-size:11.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;}
  .gslide .t2{font-size:10.5px;}
  .gcap{position:absolute;left:0;right:0;bottom:0;background:rgba(17,16,13,.72);color:#fff;font-size:11px;padding:5px 9px;font-weight:600;}
  .garrow{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border:2px solid var(--frame);background:var(--paper);font-family:var(--serif);font-size:19px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);z-index:2;}
  .gprev{left:7px;} .gnext{right:7px;}
  .gdots{display:flex;justify-content:center;gap:8px;margin-top:9px;}
  .gdot{width:8px;height:8px;border:1.5px solid var(--frame);transform:rotate(45deg);background:transparent;}
  .gdot.on{background:var(--frame);}
  .gcount{text-align:center;font-size:10px;color:var(--muted);margin-top:6px;letter-spacing:.3px;}
  .statusrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;}

  .block{border:2px solid var(--frame);background:var(--panel);padding:13px 15px;margin-top:14px;}
  .block .bh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .block .bt{font-family:var(--serif);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;}
  .concept{font-size:13.5px;line-height:1.55;}
  .concept .dish{font-family:var(--serif);font-weight:800;font-size:15px;}
  .muted{color:var(--muted);}
  .famnote{font-size:11.5px;color:var(--muted);font-style:italic;font-family:var(--serif);
    margin-top:8px;padding-left:11px;border-left:2px solid var(--hair);line-height:1.45;}

  .checkline{display:flex;align-items:flex-start;gap:11px;padding:8px 0;border-bottom:1px solid var(--hair);
    font-size:13.5px;line-height:1.4;}
  .checkline:last-child{border-bottom:none;}
  .checkline input{margin-top:1px;width:18px;height:18px;flex:none;accent-color:var(--verified);}
  .checkline span{background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 60%;background-size:0% 1.5px;transition:background-size .35s ease,color .3s;}
  .checkline.checked span{background-size:100% 1.5px;color:var(--muted);}
  .qty{font-weight:700;font-variant-numeric:tabular-nums;}
  .steps{margin:0;padding-left:20px;}
  .steps li{font-size:13.5px;line-height:1.5;padding:4px 0;}
  .steps li::marker{font-family:var(--serif);font-weight:800;color:var(--ink);}
  .stdlist{list-style:none;margin:0;padding:0;}
  .stdlist li{font-size:13.5px;line-height:1.5;padding:6px 0 6px 18px;position:relative;border-bottom:1px solid var(--hair);}
  .stdlist li:last-child{border-bottom:none;}
  .stdlist li::before{content:"◆";position:absolute;left:0;top:8px;font-size:8px;color:var(--ink);}
  .stdlist.dont li::before{content:"✕";color:#a32d2d;font-size:11px;top:6px;}
  .pkglbl{font-family:var(--serif);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:3px;}
  .pkgimg{width:100%;height:auto;display:block;border:1.5px solid var(--frame);margin:2px 0 12px;}
  .dgfig{margin:8px 0 4px;}
  .dgfig img{width:100%;height:auto;display:block;border:1.5px solid var(--frame);}
  .dgfig figcaption{font-size:10.5px;color:var(--muted);font-style:italic;margin-top:4px;}
  .dgpair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 2px;}
  .dgpair .dgfig{margin:0;}
  .dgpair figcaption{text-align:center;font-style:normal;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .mtips{margin:6px 0;}
  .mtip{border-left:3px solid var(--frame);background:var(--soft);padding:9px 12px;margin-bottom:8px;font-size:12.5px;line-height:1.5;}
  .mtip .mtl{display:block;font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
  .mtip-team{border-left-color:#5170FF;}
  .mtip-eff{border-left-color:#B8912E;}
  .mtip-safe{border-left-color:var(--chef);}
  .mtip-gloss{border-left-color:var(--displayed);}
  .lbgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;}
  .lbcard{border:2px solid var(--frame);background:var(--panel);}
  .lbimgw{position:relative;border-bottom:2px solid var(--frame);}
  .lbimgw img{width:100%;height:auto;display:block;}
  .lbmore{position:absolute;bottom:6px;right:6px;font-size:8.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;background:rgba(20,19,16,.72);color:#fff;padding:3px 7px;cursor:pointer;}
  .lbb{padding:9px 11px;}
  .lbt{font-family:var(--serif);font-weight:800;font-size:13.5px;line-height:1.2;}
  .lbd{font-size:11px;color:var(--muted);line-height:1.4;margin-top:3px;}
  .lbtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;}
  .lbtag{font-size:8.5px;font-weight:700;letter-spacing:.5px;border:1.5px solid var(--verified);color:var(--verified);padding:2px 6px;}
  .lbnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
  .lbsec{display:flex;align-items:center;gap:10px;margin:22px 0 10px;scroll-margin-top:70px;}
  .lbsect{font-family:var(--serif);font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;}
  .lbcount{font-size:10px;font-weight:700;background:var(--charcoal);color:#fff;padding:1px 7px;border-radius:20px;}
  .bgtabs{display:flex;gap:8px;margin:14px 0 4px;}
  .bgtab{flex:1;font-family:var(--sans);font-size:12.5px;font-weight:700;border:2px solid var(--frame);background:var(--paper);color:var(--ink);padding:9px 8px;cursor:pointer;}
  .bgtab.on{background:var(--charcoal);color:#fff;}
  .jscorebar{display:flex;align-items:center;justify-content:space-between;margin:10px 0;}
  .jscore{font-family:var(--serif);font-weight:800;font-size:18px;}

  .jmodal{max-width:400px;width:100%;text-align:center;color:#fff;}
  .jval{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#F5C518;margin-bottom:12px;}
  .jclue{font-family:var(--serif);font-weight:800;font-size:23px;line-height:1.3;margin-bottom:18px;}
  .jans{font-family:var(--serif);font-size:18px;color:#F5C518;margin-bottom:18px;line-height:1.35;}
  .jbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .attirehero{position:relative;border:2.5px solid var(--frame);margin-top:2px;}
  .attirehero img{width:100%;display:block;}
  .acap{position:absolute;top:10px;left:10px;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:4px 9px;border:1.5px solid var(--frame);}
  .acap.ok{background:#eaf5ee;color:#1e5c34;}
  .attstack{margin-top:2px;}
  .attshot{margin:0 0 14px;border:2.5px solid var(--frame);}

  .attshot figcaption{background:var(--charcoal);color:#f2eee4;font-size:11.5px;font-weight:600;padding:8px 11px;line-height:1.4;border-top:2px solid var(--frame);}
  .manual{display:flex;align-items:center;gap:12px;border:2.5px solid var(--frame);background:var(--panel);padding:13px 15px;margin-bottom:11px;text-decoration:none;color:var(--ink);cursor:pointer;}
  .manual:active{transform:scale(.99);}
  .manual .rt{font-family:var(--serif);font-weight:800;font-size:16px;}
  .manual .rd{font-size:11px;color:var(--muted);margin-top:2px;}
  .manual .go{margin-left:auto;font-family:var(--serif);font-size:20px;color:var(--muted);}
  .ltbl{width:100%;border-collapse:collapse;font-size:12.5px;}
  .ltbl th{text-align:left;font-family:var(--serif);font-size:10px;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid var(--frame);padding:6px 6px;}
  .ltbl td{padding:7px 6px;border-bottom:1px solid var(--hair);vertical-align:top;}
  .ltbl tr:last-child td{border-bottom:none;}
  .ltbl .lnote{color:var(--muted);font-size:11px;}
  .saybox{border-left:3px solid var(--frame);background:var(--soft);padding:9px 12px;margin:10px 0;font-size:13px;font-style:italic;font-family:var(--serif);line-height:1.45;}
  .saybox .sayl{font-family:var(--sans);font-style:normal;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px;}
  .sop{border:2px solid var(--frame);background:var(--panel);margin-top:14px;}
  .sop summary{font-family:var(--serif);font-weight:800;font-size:13px;padding:12px 14px;cursor:pointer;list-style:none;}
  .sop summary::-webkit-details-marker{display:none;}
  .sop summary::after{content:"＋";float:right;font-weight:400;}
  .sop[open] summary::after{content:"–";}
  .sopsec{padding:0 14px 12px;}
  .soph{font-family:var(--serif);font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:1px;margin:8px 0 3px;}
  .sopb{font-size:12.5px;line-height:1.5;color:#34302b;}
  .swrow{display:flex;align-items:center;gap:13px;padding:9px 0;border-bottom:1px solid var(--hair);}
  .swrow:last-child{border-bottom:none;}
  .swch{width:42px;height:42px;flex:none;border:1.5px solid var(--frame);}
  .swname{font-family:var(--serif);font-weight:800;font-size:14px;}
  .swhex{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.5px;}
  .swdesc{font-size:11.5px;color:#34302b;margin-top:1px;line-height:1.4;}
  /* Bar glassware calculator */
  .bgtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .bgtab{flex:1;min-width:92px;font-family:var(--sans);font-weight:700;font-size:12px;padding:9px 8px;border:2px solid var(--frame);background:var(--paper);color:var(--ink);cursor:pointer;}
  .bgtab.on{background:var(--bar);border-color:var(--bar);color:#fff;}
  .bgcard{border:2.5px solid var(--frame);background:#FCFCFB;padding:14px;margin-bottom:14px;}
  .bgsub{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:10px;}
  .bgcount{font-weight:800;color:var(--bar);}
  .bgline{display:flex;align-items:baseline;gap:10px;padding:9px 2px;border-bottom:1px solid var(--hair);}
  .bgline:last-child{border-bottom:none;}
  .bgn{font-family:var(--serif);font-weight:800;font-size:19px;color:var(--bar);min-width:82px;flex:none;}
  .bgg{font-size:14px;color:var(--ink);}
  .bgrule{margin-top:10px;font-size:12px;color:#5c574c;background:#f4efe2;padding:8px 10px;border-left:3px solid var(--bar);}
  .bgwarn{border:2px solid var(--bar);background:#fff6ec;padding:12px 14px;margin-bottom:14px;}
  .bgwt{font-family:var(--serif);font-weight:800;color:#b8641a;margin-bottom:6px;}
  .bgwarn ul{margin:0;padding-left:18px;}
  .bgwarn li{font-size:13px;margin:4px 0;line-height:1.4;}
  .ctaband{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bar);color:#fff;padding:13px 15px;margin-bottom:14px;cursor:pointer;box-shadow:3px 3px 0 var(--frame);}
  .ctaband .ctat{font-family:var(--serif);font-weight:800;font-size:15px;}
  .ctaband .ctas{font-size:12px;opacity:.93;margin-top:2px;}
  .ctaband .go{color:#fff;font-size:20px;}
  .qcframe{border:2.5px solid var(--frame);background:#f5f6f8;margin:8px 0 12px;box-shadow:3px 3px 0 var(--frame);}
  .qcframe iframe{width:100%;height:640px;border:0;display:block;}
  /* Bar program calculator */
  .bccard{border:2.5px solid var(--frame);background:#FCFCFB;padding:14px;margin-bottom:14px;}
  .bcrow2{display:flex;gap:12px;margin-bottom:12px;}
  .bcfield{flex:1;display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5c574c;}
  .bcfield input{font-family:var(--sans);font-size:18px;font-weight:700;border:2px solid var(--frame);background:var(--paper);color:var(--ink);padding:8px 10px;}
  .bcslider{margin-bottom:10px;}
  .bctoast{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink);cursor:pointer;}
  .bcsum{display:flex;gap:8px;margin:4px 0 4px;flex-wrap:wrap;}
  .bcstat{flex:1;min-width:66px;border:2px solid var(--frame);background:#fff;padding:9px 6px;text-align:center;}
  .bcstat .bcnum{font-family:var(--serif);font-weight:800;font-size:23px;color:var(--charcoal);}
  .bcstat .bcl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
  .bcgrp{font-family:var(--serif);font-weight:800;color:var(--charcoal);margin:15px 0 6px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--frame);padding-bottom:4px;}
  .bcgt{font-size:12px;color:var(--muted);font-weight:600;}
  .bcline{display:flex;align-items:baseline;gap:12px;padding:7px 2px;border-bottom:1px solid var(--hair);}
  .bcline:last-child{border-bottom:none;}
  .bcline .bcb{font-family:var(--serif);font-weight:800;font-size:18px;color:var(--bar);min-width:34px;text-align:right;flex:none;}
  .bcline .bcn{font-size:14px;color:var(--ink);}
  .bcsup{font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#efe9d9;padding:1px 6px;border-radius:8px;margin-left:6px;white-space:nowrap;}
  .bcnote{font-size:11px;color:#5c574c;background:#f4efe2;padding:9px 11px;border-left:3px solid var(--charcoal);margin-bottom:14px;}
  /* Setup badges */
  .setupbadge{display:flex;align-items:center;gap:12px;border:2px dashed var(--frame);background:#fff;padding:12px 14px;margin:14px 0;cursor:pointer;position:relative;transition:transform .1s;}
  .setupbadge:active{transform:scale(.99);}
  .setupbadge .sbi{font-size:26px;flex:none;filter:grayscale(1);opacity:.6;}
  .setupbadge .sbt{display:flex;flex-direction:column;line-height:1.3;}
  .setupbadge .sbt b{font-family:var(--serif);font-size:14px;color:var(--ink);}
  .setupbadge .sbt small{font-size:11px;color:var(--muted);}
  .setupbadge.earned{border-style:solid;border-color:var(--bar);background:linear-gradient(0deg,#fff6ec,#fffdf8);}
  .setupbadge.earned .sbi{filter:none;opacity:1;}
  .setupbadge.earned .sbt b{color:#b8641a;}
  .bdgtop{display:flex;align-items:center;gap:14px;border:2.5px solid var(--frame);background:#FCFCFB;padding:12px 16px;margin:6px 0 14px;}
  .bdgtop .ringsvg{width:64px;height:64px;flex:none;}
  .bdgbig{font-family:var(--serif);font-weight:800;font-size:26px;color:var(--charcoal);}
  .bdgsub{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  .bdggrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .bdg{border:2px solid var(--hair);background:#faf8f3;padding:12px 10px;text-align:center;cursor:pointer;opacity:.7;}
  .bdg.on{border-color:var(--bc);background:#fff;opacity:1;box-shadow:inset 0 0 0 1px var(--bc);}
  .bdg .bdgm{font-size:26px;filter:grayscale(1);}
  .bdg.on .bdgm{filter:none;}
  .bdg .bdgn{font-family:var(--serif);font-weight:700;font-size:13px;line-height:1.25;margin-top:4px;color:var(--ink);}
  .bdg .bdgc{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:2px;}
  /* Guest-count scaling control */
  .gcbar{border:2px solid var(--frame);background:#FCFCFB;padding:11px 12px;margin-bottom:13px;}
  .gclabel{font-family:var(--serif);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .gcrow{display:flex;align-items:center;gap:12px;}
  .gcrow input[type=range]{flex:1;accent-color:var(--charcoal);height:22px;}
  .gcval{font-family:var(--serif);font-weight:800;font-size:15px;min-width:82px;text-align:right;}
  .gchint{font-size:10.5px;color:var(--muted);margin-top:10px;line-height:1.5;}
  .qrule{display:inline-block;font-size:8.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);border:1px solid var(--hair);padding:1px 5px;margin-left:6px;white-space:nowrap;}
  .qrule.cf{color:var(--review);border-color:var(--review);}

  /* Perfecting Pointer — deck style: color panel, black border, star, italic serif label */
  .pointer{border:2.5px solid var(--frame);padding:13px 15px;margin-top:16px;background:var(--pc,#eee);}
  .pointer .pl{font-family:var(--serif);font-style:italic;font-weight:700;font-size:16px;
    display:flex;align-items:center;gap:8px;margin-bottom:6px;color:#141310;}
  .pointer .star{color:var(--gold);font-style:normal;font-size:16px;}
  .pointer .pv{font-size:13px;line-height:1.5;color:#171512;}
  .pointer .pv u{text-underline-offset:3px;}
  .pointer.tbd{background:var(--soft);border-style:dashed;}
  .pointer.tbd .pl,.pointer.tbd .pv{color:var(--muted);}

  /* GUEST ready */
  .guest{border:2.5px solid var(--frame);background:#FCFCFB;padding:15px;margin-top:16px;}
  .guest .gh{font-family:var(--serif);font-size:17px;font-weight:800;text-align:center;margin-bottom:2px;}
  .guest .gsub{font-size:10.5px;color:var(--muted);text-align:center;margin-bottom:12px;
    display:flex;flex-direction:column;align-items:center;gap:7px;}

  .gitem input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--verified);}

  .gitem .gT{background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 60%;background-size:0% 1.5px;transition:background-size .35s ease,color .3s;}
  .gitem.checked .gT{background-size:100% 1.5px;color:var(--muted);}

  .tbdbox{border:1.5px dashed #BFBDB6;background:var(--soft);color:var(--muted);padding:11px 13px;
    margin-top:14px;font-size:12px;line-height:1.45;}
  .tbdbox b{color:#5c574c;}
  .note-inline{font-size:11.5px;color:var(--muted);background:var(--soft);border:1px solid var(--hair);
    padding:10px 12px;margin:14px 0 2px;line-height:1.5;}
  .note-inline b{color:#4a463d;}

  /* Puff 'n Stuff logo block */
  .logoblock{background:var(--charcoal);margin:24px -18px -26px;padding:20px;text-align:center;}
  .logoblock .pflogo{width:64%;max-width:220px;height:auto;display:block;margin:0 auto;}
  .logoblock .pf{font-family:var(--serif);color:#fff;font-size:26px;font-weight:700;letter-spacing:.5px;}
  .logoblock .pf sup{font-size:13px;font-style:italic;}
  .logoblock .ec{color:#cfcabf;font-size:9px;letter-spacing:5px;text-transform:uppercase;margin-top:3px;}

  .rule{text-align:center;font-family:var(--serif);font-style:italic;font-size:12.5px;
    color:var(--muted);margin-top:20px;letter-spacing:.5px;}

  /* GUEST Ready standard page */
  .gintro{border:2.5px solid var(--frame);background:var(--charcoal);color:#f6f5f0;
    padding:16px 17px;margin-top:14px;font-size:13px;line-height:1.55;}
  .gintro .q{font-family:var(--serif);font-style:italic;font-weight:700;font-size:20px;
    text-align:center;margin-top:9px;color:#fff;}
  .guestcard{border:2px solid var(--frame);background:var(--panel);padding:13px 14px;
    margin-top:12px;display:flex;gap:14px;align-items:flex-start;}
  .gcL{font-family:var(--serif);font-weight:900;font-size:24px;color:#fff;background:var(--charcoal);
    width:42px;height:42px;flex:none;display:flex;align-items:center;justify-content:center;
    border:2px solid var(--frame);}
  .gcT{font-family:var(--serif);font-size:16px;font-weight:800;letter-spacing:.2px;}
  .gcLead{font-size:12.5px;color:var(--muted);margin:3px 0 8px;font-family:var(--serif);font-style:italic;}

  .gcBul li::before{content:"◆";position:absolute;left:0;top:5px;font-size:8px;color:var(--ink);}

  /* Philosophy path rows */
  .pathrow{padding:9px 0;border-bottom:1px solid var(--hair);}
  .pathrow:last-child{border-bottom:none;}
  .pathrow .pw{font-family:var(--serif);font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.5px;}
  .pathrow .ps{font-family:var(--serif);font-size:14px;color:var(--muted);}

  /* Core Values cards */
  .valwrap{display:flex;flex-direction:column;gap:10px;margin-top:14px;}

  .valname{font-family:var(--serif);font-weight:800;font-size:17px;letter-spacing:.2px;}
  .valdesc{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45;}
  .valdesc .confirm{color:var(--review);font-style:italic;font-size:11px;}
  .pquote{font-family:var(--serif);font-style:italic;font-size:16px;text-align:center;line-height:1.5;color:var(--ink);margin:16px 8px 2px;}

  .gsearch{width:100%;font-family:var(--sans);font-size:14px;border:2.5px solid var(--frame);background:var(--panel);padding:10px 12px;margin:6px 0 14px;color:var(--ink);}

  .relchip{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.3px;border:1.5px solid var(--frame);background:var(--soft);color:var(--ink);padding:3px 8px;cursor:pointer;}

  .rsrc{font-size:10.5px;color:var(--muted);margin:10px 0 12px;line-height:1.4;}

  .rchip{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.3px;border:1.5px solid var(--frame);background:var(--panel);color:var(--ink);padding:5px 10px;cursor:pointer;}

  .rdate{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .rtext{font-size:13.5px;line-height:1.55;}
  .rtext.rq{font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.5;}
  .rwho{margin-top:9px;display:flex;flex-direction:column;gap:1px;}
  .rname{font-family:var(--serif);font-weight:800;font-size:14px;}
  .rmeta{font-size:11px;color:var(--muted);}

  /* Playbook — video slot + knowledge check */
  .vslot{border:2.5px solid var(--frame);background:var(--charcoal);aspect-ratio:16/9;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#e6e4df;text-align:center;margin-top:2px;}

  .vslot .vt{font-family:var(--serif);font-weight:800;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;}
  .vslot .vs{font-size:11px;color:#cfcabf;}
  .quiz{border:2.5px solid var(--frame);background:#FCFCFB;padding:14px 15px;margin-top:15px;}
  .qk{font-family:var(--serif);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:8px;margin-bottom:10px;}

// Glossary of Puff 'n Stuff terms (from the SET Glossary training manual)
const GLOSSARY=[["A la minute", "A style of cooking where an item, or particularly its accompanying sauce, is prepared to order, rather than being prepped in advance and held for service."], ["Amuse-Bouche", "A bite-sized hors d’oeuvre that is prepared according to the chef’s selection."], ["Back of the house", "The behind the scenes area of an event to include the staging and breakdown stations and kitchen. At PnS, our back stage is on stage – Keep it neat and tidy"], ["Behind You", "Said when coming up behind a co-worker to inform him or her of your presence"], ["Break Down", "The process of closing down and cleaning up after a catered event."], ["Break Down Station", "A staging area in the back of house space used to repack soiled dishware"], ["Brut", "A brut champagne or sparkling wine refers to the level of sweetness or dryness. Brut is a dry"], ["Buffet", "Style of catered event where guests serve themselves from platters and chafing dishes displayed on tables. Can be single- or double-sided buffets, depending upon the sides of the table open for service."], ["Bus Tub", "Plastic tubs used to store dirty flatware and serving utensils"], ["Butane Burner", "Small table top burner fueled by butane cans. Ideal for heating sauces, pastas, and/or sautéing items at a chef attended action station."], ["Butler Pass Service", "Tray service of canapés and hors d'oeuvres and beverages that are carried by servers and presented to guests. Used primarily at receptions."], ["Cabaret Table (Cocktail Table)", "A short cocktail table that seats 2-4 guests."], ["Cake Knife and Server", "Decorative utensils for cutting and serving cakes."], ["Cambro", "An insulated beverage container capable of keeping hot liquid at a hot temperature for extended periods of time. However, if coffee service begins more than (3) hours after arrival onsite to your event, transfer coffee to the back up urns in the staging area for holding. Server, Bartender, or Event Chef."], ["Canapé", "Hors d’oeuvre consisting of a small piece of bread or toast, often cut in a decorative shape, garnished with a savory spread or topping."], ["Carving Station", "A table set up with specific food items carved by a culinary chef during a buffet or reception, e.g., carved beef station."], ["Cash Bar", "Cash bars allow the client to pay a pre-determined per person bar set up fee and offer their guests the option to purchase beverages independently. Clients may choose to host some of the beverages for the guests or only non-alcoholic beverages."], ["Cave Cooking", "a method of cooking without power using metro boxes and sterno"], ["Chafing Dish", "(Chafer) Special serving dishes with lids and a heat source underneath to keep food warm. Can be round and oblong in shape. Inserts are the food pans placed in chafing dishes."], ["Chair Dolly", "A carrying device with wheels for moving stacking banquet chairs."], ["Chairs, Stacking Banquet", "chairs which can be stacked for storage."], ["Chairs, Wooden Folding", "chairs which can be folded for storage."], ["Champagne Bucket", "A metal bucket that is filled with ice and water, used to chill champagnes and white wines."], ["Charger", "A charger plate is a base plate that is pre-set at the guest's place setting in addition to the flatware, glassware, and linen napkin. It is typically larger than a dinner plate and elevate the look and style of the table design."], ["Chef Attended Action Station", "An interactive food station that incorporates food as entertainment as the floor chefs create dishes made to order for the guest."], ["Chiavari Chair", "The Chiavari chair is an elegant upgraded chair, typically selected for weddings or formal special events. The chair is named after the coastal Italian town of Chiavari from which the design of the chair originates. Chiavaris come in a range of color and finishes from gold and silver to clear acrylic and natural wood."], ["Clearing", "The process of removing dirty plates, glassware, flatware, and other debris from tables. Can be done to remove the plates and utensils from a particular course, or the general clearing at the end of an event. Also known as bussing."], ["Cocktail", "A drink containing two or more liquors and/or mixers."], ["Cocktail Hour", "Also known as a pre-reception or social hour before the main event. Guests are often treated to hors d'oeuvres or light snacks, along with an assortment of beverage options, to include alcoholic and non-alcoholic."], ["Cocktail Napkin", "The little square paper napkin which a beverage rests on."], ["Cocktail Tray", "A small tray used for clearing or passing beverages or small plates."], ["Coffee Urn", "A large metal dispenser capable of holding hot liquid at a hot temperature for extended periods of time. Sterno fuel canisters heat the urns and last for approximately (6) hours."], ["Coming Around/Corner", "Said before going around a blind corner of to allow others to know of his/her approach."], ["Consumption Bar", "Consumption bars allow the client to only pay for drinks that their guests consume."], ["Consumption Sheet", "A form that a bartender uses to tally all beer, wine, liquor, soft drinks, and bottled waters served during an event. Drink tickets may also be used and tallied on a consumption basis."], ["Courses", "The components of a plated meal."], ["Deacon", "A 6' x 18\" table (a \"skinny\" table) used for classroom style seating. Puff 'n Stuff typically uses deacons at stations, as back bars, or as display tables for events with limited space available. Also known as a classroom table."], ["DMC", "A destination management company. A company that specializes in the organization and logistics of corporate meetings and events in a specific location or destination."], ["Dual Entrée", "An entree that features (2) protein choices on the same plate. Most often, this is (2) 4 ounce protein options that are paired together to give the guests variety without having to create several entree plate options."], ["Dump Bucket", "A dump bucket is an empty container used to pour the remaining liquid from glasses used during service. Each dump bucket is covered with a strainer to catch debris like stir sticks, bar fruit, napkins, and bar picks from falling into the liquid. Never pour liquid into the garbage cans. Conversely, do not clear trash or debris into the dump buckets!"], ["Escort Card", "Escort cards are used to inform guests of which table they will be seated at in the main reception area. Guest names and table numbers are gracefully displayed on the cards and minimize confusion and wandering bodies. If there is a pre-selected entree, the escort card will typically display a symbol or have a color identifier on the card that corresponds with their selected meal choice."], ["Expeditor", "Expo Person in charge of organizing food from the kitchen and sending it to the dining room; a mediator of the line."], ["Family Style Service", "Food served on platters at the center of the table (rather than on plates in the kitchen) so guests can serve themselves while seated"], ["Flambé", "A cooking technique in which alcohol is added to a hot pan to create a burst of flames. The word means flamed in French. Puff 'n Stuff offers (3) signature flambé dishes: Bananas Foster, Cherries Jubilee, and Blazing Donuts."], ["Floor Plan", "A layout of the event space that is drawn to scale (based on the dimensions of the room). Floor plans include the seating and display tables, chairs, buffet or food stations, bar set ups, and any other important room design elements."], ["FOB", "Father of the bride"], ["Football Tray", "Large oval or round trays used by servers to carry food and clear tables."], ["French Service", "French Style Service includes table side preparation as well as specific guidelines for serving. French Style catering adds an extra air of elegance and flair to an event. French style service showcases the food while entertaining your guests."], ["Front of The House", "The reception space where guests will gather and dine."], ["Garnish", "An item or substance used as a decoration or embellishment accompanying a prepared food dish or drink. In many cases, it may give added or contrasting flavor. Some garnishes are selected mainly to create visual interest on the plate, while others are selected specifically for flavor."], ["Glass Racks", "Plastic carrying, washing, and storage containers for glassware"], ["Glossary", "A"], ["Gluten Free", "An item that does not contain gluten, a protein composite found in wheat and related grains, including barley and rye. Items like potatoes and rice are gluten free but pasta and crackers are not."], ["Gooseneck", "A gooseneck is a stainless metal gravy boat used to hold dressings when salad dressing is pre-set on the guest seating tables."], ["Guide Chair", "A chair placed at the 12 o'clock position at a table. Every seating table in the event space should have a guide chair in the same position to create a symmetric room set."], ["HACCP", "Hazard Analysis & Critical Control Points. A system to prevent hazards from occurring during food production vs. completed product inspection."], ["Half Sheet Pan", "A flat, rectangular metal sheet pans that can fit inside turbo and household ovens. All HOD are sent on half pans."], ["Hand Truck", "A two-wheeled, upright cart with a solid plate or platform that is slid under your cargo to make transport easier and more efficient. Hand trucks are usually used for smaller items like packed glass racks, plate crates, or tubs. This tool is usually designed to carry up to 600 lbs."], ["Head Count", "A count of the actual number of attendees at an event."], ["Hors D'oeuvre (HOD)", "A food item served before the main courses of a meal, typically smaller than main dishes, and often meant to be eaten by hand (with minimal use of silverware)"], ["Hot Box", "Insulated, heated containers, usually on wheels, used for holding heated food items for catered events. Fueled by sterno."], ["Ice Down Tub", "A durable plastic tub used for chilling beverage product behind the bar. Not for display purposes."], ["Intermezzo", "This Italian term means “in between.” It is a sorbet course designed to cleanse the palate before the main course of a formal, multi-course dinner."], ["Jigger", "A tool used by mixologists and bartenders to accurately measure alcohol for cocktails and mixed drinks. Measures 1.5 ounces exactly."], ["Kings Table", "A long table created by placing or grouping multiple rectangular tables together. Guests sit on either side of the table, and the look and feel is more reminiscent of a grand dining table in a glorious home. Some brides choose this for the head table and seat the guests at the traditional round tables. Also known as a Feasting Table."], ["Large Convection Oven", "A restaurant-grade convection oven on wheels typically sent for larger events with multiple food items. Holds 3,7, and 8 quart chafer inserts and half and full-sheet pans."], ["Load In", "Specified period of time for loading in equipment"], ["Load Out", "Specified period of time for loading out equipment"], ["Misen Place", "“Put in place.” The preparation and assembly of all service needs for a particular dish or service period."], ["Mixer", "Non-alcoholic beverages, i.e. ginger ale, juices, tonic, etc., added to liquor to make a mixed drink."], ["MOB", "Mother of the bride"], ["Mocktail", "A non-alcoholic cocktail"], ["Monkey Dish", "A small white porcelain dish used for sauces or lemon wedges on guest seating tables"], ["On The Fly", "Something needed quickly"], ["Overage", "A small percentage of food sent over and above the quantified number of pieces on the Special Event Order. Puff 'n Stuff typically supplies a 3% overage on events under 150 people and a 5 % overage on events with over 150 people."], ["Pipette", "A small dropper used to hold liquids or sauces that accompany an hors d'oeuvre. Puff 'n Stuff's signature Sunset Shrimp features a cilantro lime shrimp with chileverde sea salt and a margarita cocktail in a pipette that is skewered into the shrimp."], ["Place Setting", "Includes all of the flatware and service ware needed for a single guest to dine. Utensils are arranged in the order and according to the manner in which the diner will use them"], ["Plate Crate", "A milk crate used to transport and store plates to and from events. A milk crate holds (40) 7\" or 8\" plates and (20) 9\", 10\", or 12\" plates."], ["Plated Service", "Style of catered event where guests are seated and have food served to them on individual plates during various courses."], ["Pre-selected Entree", "An entree selection that a guest has chosen prior to the event. Typically the meal choice is indicated when the guest RSVPs for the event. The meal the guest has chosen is often indicated by a color or symbol on the guest's escort card."], ["Pre-shift Meeting", "A mini-meeting before an event to inform the staff of special instructions and other information for the event."], ["Queen Mary", "A stainless steel cart ideal for banquets, catering and bussing. This cart is built to handle the big loads and is a must in any high volume situation."], ["Reception", "A catered event where guests usually stand and mingle. Food is passed or served at stations. As opposed to a seated or plated meal."], ["Road Report", "An Event Chef's instruction guide to the preparation and cooking times and methods for items on a Puff 'n Stuff Special Event Order."], ["Room Flip", "An industry term that describes when an event space or room is completely transformed between stages of an event, such as from a wedding ceremony to a dinner reception. Flips require planning and teamwork to ensure the event flows smoothly."], ["Section", "A grouping of tables assigned to each server for an event. The server is responsible for providing dedicated service and table maintenance to each table in their section from the start of the event to the very last moment!"], ["Serpentine Table", "A table shape that is curved and resembles an \"S.\""], ["Serviette", "Napkin fold placed on a plate or tray and filled with flatware. Used for carrying and presenting replacement flatware."], ["Serving Spoons", "Spoons to serve food items. Either regular and slotted."], ["Set Up", "The process of preparing a venue for a catered event. Includes table and chair set up, linens, place settings, food displays and presentation, service prep areas, and decor."], ["Show Time", "The time at which an event is to start, or when guests start arriving for an event. The time when all set up must be completed and staff standing tall ready to provide service."], ["Signature Drink", "Any unique or original drink that expresses the nature of the person or the organization creating it. Signature Drinks often incorporate local ingredients and culture. They can be fashioned or designed to represent a theme or color. Popular for weddings. A bride and groom may each have a Signature Drink that reflects their personality or their favorite cocktail!"], ["Slim Jim Trash Can", "A durable plastic rectangular trash can that is used for clearing trash. Used in tight spaces-at break down stations and at bars."], ["Smile", "Most important part of your uniform!"], ["Special Event Coordinator", "The administrative assistant assigned to a Special Event Planner."], ["Special Event Order", "An event contract that details the client's event menu, service style, timeline, staffing levels, and rentals. Similar to a Banquet Event Order (BEO)."], ["Special Event Planner", "The Sales Manager assigned from Puff 'n Stuff to work with clients from beginning to the end of their event. The SEP will work to plan and develop the clients’ event experience from start to finish including: developing proposals, coordinating menu tastings, attending site visits, communicating with internal teams, and attending events to ensure client satisfaction."], ["Speed Rack", "A sheet pan rack used to hold and transport food items to and from the commissary for an event. All speed racks are wrapped in plastic wrap and locked in with a ratchet strap in the event vehicles to protect the food items from falling or damage during travel to the site."], ["Steps of Service", "The sequence of service for an event. Assigns responsibility for each team member during service to include section assignments, tray passing, bussing, buffet or station maintenance, and back of house responsibilities."], ["Sterno", "A wick fuel packaged in small cans, used to heat food."], ["Strike", "To “strike” means to breakdown the event. When you see on a proposal that states a strike time at 10pm that literally means that vendors are allowed to breakdown an event at that time!"], ["Sweetheart Table", "A table for 2 (Bride and Groom) usually flanked by round or feasting tables for people in the wedding party and their guests."], ["Tables, Banquet Folding", "tables used to seat guests during catered events. Typical sizes include 64 inch rounds, 72 inch rounds, 6 foot banquet (rectangular), 8 foot banquet (rectangular). Tables, Specialty Unusually shaped folding tables used primarily for buffets, e.g., serpentine, half-round."], ["Tall Cocktail Table", "A high top table often used in cocktail parties, receptions, or events that encourages guests to mingle and move throughout the space instead. Also known as highboy or knockdown tables."], ["Tall Drink", "Any drink served in a glass taller (larger) than a standard high ball glass."], ["Three Tier", "A stainless steel metal cart used to transport items to and from an event."], ["Timeline", "Charts the progression of the tasks leading up to the event. Things that need to be tracked include the staff's arrival time, the production team's arrival time, and prep time for the kitchen. The event timeline can also refer to the sequence of events during the event itself to include the arrival time for guests, the timing of the courses, and the entertainment's start time."], ["Tongs", "Serving utensil designed with a central fulcrum allowing the user to grasp a food item."], ["Tray Jack", "A folding stand used to set serving trays on when serving food or clearing tables."], ["Turbo Oven", "Small convection-style ovens typically sent for smaller events with limited food or space for a large oven. Holds 3 and 7 quart chafer inserts and half sheet pans. Does not hold 8 quart pans or full sheet pans."], ["Underliner", "Cloth used under tablecloths on a banquet table to produce a soft, cushioned feel to the diner or to"], ["Underliner Plate", "A plate or platter used as a base plate for"], ["Uplighting", "Accent lighting used on an event to elevate the ambience. Can be used to incorporate a color scheme into the overall room design by surrounding the room or call attention to key spaces like the cake table, head table or dance floor for a wedding reception."], ["Varietal", "Describes a wine made primarily from a single grape variety and is typically displayed on the wine label. Refer to the chart below for the most common wine varietals."], ["Vegan", "A person who abstains from consuming or using animal products of any kind."], ["Vegetarian", "A person who relies on a non-meat diet; the diet may or may not include animal products such as dairy and/or eggs."], ["Vintner", "Refers to someone who makes or sells wine. For example, Robert Mondavi or Kendall Jackson."], ["Votive", "Small decorative candles used on tables at catered events."], ["Walk-in", "Large, walk-in refrigerator or freezer, located in the kitchen where produce, meats, etc., are stored for kitchen personnel."], ["Wine Key", "(corkscrew) An essential tool for all servers. Used to break the seal on a bottle of wine and remove the cork."], ["Z-Rack", "A rolling rack often used to hang, hold, and transport garments or linens."]];

function goSearchI(i){const e=SRES[i];if(!e)return;closeSearch();if(e.a===null||e.a===undefined)go(e.v);else go(e.v,e.a);}
function runSearch(q){
  const idx=buildSearchIndex(); q=(q||'').trim().toLowerCase();
  const el=document.getElementById('srchres');
  if(!q){el.innerHTML='<div class="srchhint">Search any station, lesson, guide, or glossary term.<br>Try “coffee”, “tray”, “allergen”, “breakdown”, or “AIS”.</div>';SRES=[];return;}
  const scored=[];
  idx.forEach(e=>{const t=e.t.toLowerCase(),s=e.s.toLowerCase();let r=-1;
    if(t.startsWith(q))r=0;else if(t.includes(q))r=1;else if(s.includes(q))r=2;
    if(r>=0)scored.push([r,e]);});
  scored.sort((a,b)=>a[0]-b[0]||a[1].t.localeCompare(b[1].t));

}

const G0=50;

function scaleQty(base,rule,g){

  if(rule==='cap25')return Math.max(1,Math.ceil(g/25));
  return n;
}

function relatedLinks(term){
  const t=term.toLowerCase(), out=[], seen={};
  function add(view,arg,label){const k=view+arg; if(arg&&!seen[k]){seen[k]=1;out.push({view:view,arg:arg,label:label});}}
  if(/place\s*-?setting|charger|underliner/.test(t)) add('station','place-setting','Place Setting');
  if(/coffee|(^|\b)urn|cambro/.test(t)) add('station','coffee-station','Coffee Station');
  const lmap=[[/buffet/,'Buffet Service','Buffet'],[/plated/,'Plated Service','Plated'],[/family style/,'Family Style Service','Family Style'],
    [/butler pass|passed|hors|canap|amuse/,'Passed Service','Passed service'],[/break ?down|strike/,'Breakdown Plan','Breakdown'],
    [/\bbar\b|jigger|speed rack|wine key|mixer|mocktail|signature drink/,'Bar Station','Bar'],[/beverage/,'Beverage Station','Beverage'],
    [/\btable/,'Tables','Tables'],[/chair/,'Chairs','Chairs'],[/linen/,'Linens','Linens'],[/napkin/,'Napkins','Napkins'],
    [/\btray/,'Service Tray','Tray handling'],[/load ?in|load ?out|truck|z-?rack|hand truck/,'Unload & Reload a Truck','Truck lesson']];
  for(const row of lmap){ if(row[0].test(t)){ const k=lessonKey(row[1]); if(k)add('pblesson',k,row[2]+' lesson'); } }
  if(/\bbar\b|jigger|speed rack|wine key|mixer|mocktail|brut|varietal|vintner|neat|jig/.test(t)) add('manual','bartender','Bartender manual');
  return out.slice(0,3);
}

const BARCALC_TIERS={
  premium:{name:'Premium',
    spirits:[["Vodka","Grey Goose","Bacardi",34],["Tequila","1800","Proximo",22],["Bourbon","Knob Creek","Suntory",20],["Gin","Bombay Sapphire","Bacardi",13],["Rum","Appleton","Campari",11]],
    wines:[["Chardonnay","Hahn","",26],["Cabernet","Bonanza","Wagner",24],["Sauvignon Blanc","Dashwood","Foley",20],["Pinot Noir","Sea Sun","Wagner",20],["Rosé","Ferrari-Carano","New",10]],
    sparkling:null},
  house:{name:'House & Open Bar',
    spirits:[["Vodka","Tito's","",30],["Tequila","Espolòn","Campari",20],["Bourbon","Maker's Mark","Suntory",18],["Gin","Bombay","Bacardi",12],["Rum","Bacardi","",10],["Scotch","Dewar's","",10]],
    wines:[["House Wine","EOS","Foley",100]],
    sparkling:["Prosecco","Ruffino","Constellation"]}
};
const BC={tier:'premium', guests:120, hours:5, winePct:45, toast:true};
function bcCompute(){
  const T=BARCALC_TIERS[BC.tier];
  const g=Math.max(0,BC.guests||0), H=Math.max(1,BC.hours||1);
  const perGuest=(1.0 + 0.75*(H-1))*1.10;            // ~1 drink/guest hr1, taper, +10%
  const totalDrinks=Math.round(g*perGuest);
  const wineDrinks=Math.round(totalDrinks*BC.winePct/100);
  const spiritDrinks=totalDrinks-wineDrinks;
  const WINE_YIELD=5, SPIRIT_YIELD=16, SPARK_YIELD=6;
  const sW=T.spirits.reduce((a,s)=>a+s[3],0)||1;
  const spirits=T.spirits.map(s=>{const d=spiritDrinks*s[3]/sW;return {cat:s[0],brand:s[1],sup:s[2],btl:Math.ceil(d/SPIRIT_YIELD)};});
  const wW=T.wines.reduce((a,s)=>a+s[3],0)||1;
  const wines=T.wines.map(s=>{const d=wineDrinks*s[3]/wW;return {cat:s[0],brand:s[1],sup:s[2],btl:Math.ceil(d/WINE_YIELD)};});
  const spark=(BC.toast&&T.sparkling)?{cat:'Sparkling toast',brand:T.sparkling[1],sup:T.sparkling[2],btl:Math.ceil(g/SPARK_YIELD)}:null;
  return {g,H,totalDrinks,spirits,wines,spark,spiritBtl:spirits.reduce((a,s)=>a+s.btl,0),wineBtl:wines.reduce((a,s)=>a+s.btl,0)};
}
function bcOut(){
  const r=bcCompute();
  const line=x=>`<div class="bcline"><span class="bcb">${x.btl}</span><span class="bcn">${x.cat} — <b>${x.brand}</b>${x.sup?`<span class="bcsup">${x.sup}</span>`:''}</span></div>`;
  return `
   <div class="bcsum">
     <div class="bcstat"><div class="bcnum">${r.totalDrinks}</div><div class="bcl">total drinks</div></div>
     <div class="bcstat"><div class="bcnum">${r.spiritBtl}</div><div class="bcl">spirit btls</div></div>
     <div class="bcstat"><div class="bcnum">${r.wineBtl}</div><div class="bcl">wine btls</div></div>
     ${r.spark?`<div class="bcstat"><div class="bcnum">${r.spark.btl}</div><div class="bcl">sparkling</div></div>`:''}
   </div>
   <div class="bcgrp">Spirits <span class="bcgt">${r.spiritBtl} btl</span></div>
   ${r.spirits.map(line).join('')}
   <div class="bcgrp">Wine <span class="bcgt">${r.wineBtl} btl</span></div>
   ${r.wines.map(line).join('')}
   ${r.spark?`<div class="bcgrp">Sparkling</div>${line(r.spark)}`:''}`;
}

    const key=(clean.imgs[0]||'').split('/').pop().split('?')[0];
    const ex=key&&byImg[key];

    clean.star=/^\*/.test(m.t);

function quizOpts(Q){
  const arr=Q.a.map((o,oi)=>({o:o,c:oi===Q.c}));
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=arr[i];arr[i]=arr[j];arr[j]=t;}
  return arr.map(x=>`<button class="qopt" data-correct="${x.c?1:0}" onclick="checkAns(this)">${x.o}</button>`).join('');
}
function checkAns(btn){
  const box=btn.closest('.quiz'); if(box.dataset.done)return; box.dataset.done="1";
  const correct=btn.dataset.correct==="1";
  box.querySelectorAll('.qopt').forEach(b=>{b.disabled=true; if(b.dataset.correct==="1")b.classList.add('ok');});
  if(!correct)btn.classList.add('no');
  const fb=box.querySelector('.qfb'); fb.style.display='block';
  fb.className='qfb '+(correct?'ok':'no');
  fb.textContent=correct?"Nailed it. ✦ That's the Puff standard.":"Not quite — the highlighted one is the standard. You've got the next one.";
  if(correct){bump('quiz');const r=btn.getBoundingClientRect();confettiBurst(r.left+r.width/2,r.top);}
}

function parseWB(wb){

function resolveLink(txt){

      ||STATIONS.find(s=>t.includes(s.name.toLowerCase())||s.name.toLowerCase().includes(t));
  if(st)return {view:'station',arg:st.id};
  if(t.indexOf('guest')>-1)return {view:'guest',arg:''};
  if(t.indexOf('value')>-1)return {view:'values',arg:''};
  if(t.indexOf('philosoph')>-1)return {view:'philosophy',arg:''};
  if(t.indexOf('service')>-1)return {view:'service',arg:''};
  return null;
}
function goLink(v,a){go(v,a||undefined);}
function setRecFilter(c){RECFILTER=c;
  screen.querySelectorAll('.rchip').forEach(b=>b.classList.toggle('on',b.textContent===c));
  const fe=document.getElementById('rfeed'); if(fe&&RECDATA)fe.innerHTML=feedHTML(RECDATA.entries);
}
function renderDeliver(){
  const rlist=VIEWAS==='exec'?ROLE_ORDER:(DEPTS[VIEWAS].roles||[]);
  const cards=rlist.map(k=>{const r=TRAINING[k]; if(!r)return''; const p=progFor(k,r.n),pct=r.n?Math.round(p/r.n*100):0;
    return `<div class="role" onclick="go('role','${k}')">
      <div class="rhd"><div class="rttl">${roleName(k)}</div><div class="rsub">${dayTag(r.title)} · ${r.n} tasks</div></div>
      <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>
      <div class="pmeta">${p}/${r.n} complete · ${pct}%</div></div>`;}).join('')
    || '<div class="note-inline">No checklist for this department yet — yours is on the way.</div>';
  const lead=VIEWAS==='exec'?'Role-based onboarding. Tap your role, work through the tasks, and your progress is saved on this device.':`Training checklists for <b>${DEPTS[VIEWAS].label}</b>. Progress is saved on this device.`;
  screen.innerHTML=`
    <p class="kicker">Deliver Perfection</p>
    <h1 class="disp">Training Checklists</h1>
    <p class="lead">${lead}</p>
    ${cards}
    <div class="grid" style="margin-top:16px">
      <div class="tile planned"><div><div class="tt">Performance</div><div class="td">Goals &amp; feedback</div></div>${badge('plan','Planned')}</div>
      <div class="tile planned"><div><div class="tt">Resources</div><div class="td">Handbook · PTO · uniform</div></div>${badge('plan','Planned')}</div>
    </div>
    <div class="tbdbox">Personal <b>login &amp; certification sign-off</b> are a later phase — for now, progress is remembered on this device only.</div>
    <div class="rule">Dedication ~ Quality ~ Creativity</div>`;
}
function renderRole(k){
  const r=TRAINING[k]; if(!r){screen.innerHTML='<p class="lead">Checklist not found.</p>';return;}
  const saved=loadProg()[k]||{}; let gi=0;
  const secHTML=r.secs.map(s=>{
    const items=s.t.map(t=>{const id=gi++; return `<label class="tk"><input type="checkbox" ${saved[id]?'checked':''} onchange="tkToggle('${k}',${id},this)"><span>${t}</span></label>`;}).join('');
    return `<div class="tsec"><div class="tsh">${s.c}</div>${items}</div>`;
  }).join('');
  const p=progFor(k,r.n),pct=r.n?Math.round(p/r.n*100):0;
  screen.innerHTML=`
    <div class="titleblock" style="--tbcolor:var(--charcoal)"><span class="diamond" style="--dc:var(--paper)"></span><span class="tbtext" style="color:#fff">${roleName(k)}<small style="color:#e6e4df">${r.title}</small></span></div>
    <div class="pbar big"><div class="pfill" id="rolefill" style="width:${pct}%"></div></div>
    <div class="pmeta" id="rolemeta">${p}/${r.n} complete · ${pct}%</div>
    <div class="statusrow">${badge('verified','From checklist')}${badge('tbd','Saved on device')}</div>
    ${secHTML}
    <div class="rule">Dedication ~ Quality ~ Creativity</div>`;
}
function tkToggle(k,id,el){
  const p=loadProg(); p[k]=p[k]||{}; if(el.checked){p[k][id]=1;bump('task');} else delete p[k][id]; saveProg(p);
  const r=TRAINING[k],c=progFor(k,r.n),pct=r.n?Math.round(c/r.n*100):0;
  const f=document.getElementById('rolefill'),m=document.getElementById('rolemeta');
  if(f)f.style.width=pct+'%'; if(m)m.textContent=c+'/'+r.n+' complete · '+pct+'%';
  if(el.checked&&c===r.n&&r.n&&m&&!document.getElementById('certstamp')){
    const rc=(f||m).getBoundingClientRect();confettiBurst(rc.left+rc.width/2,rc.top);
    const st=document.createElement('div');st.id='certstamp';st.className='stamp';st.textContent='Certified ✦';m.after(st);
  }
}
/* ---------- Celebrations, streaks & daily rotation ---------- */
const SKEY='p2p_stats_v1';
function stLoad(){try{return JSON.parse(localStorage.getItem(SKEY))||{};}catch(e){return {};}}
function stSave(s){try{localStorage.setItem(SKEY,JSON.stringify(s));}catch(e){}}
function todayKey(){return new Date().toISOString().slice(0,10);}
function bump(kind){const s=stLoad();s.days=s.days||{};s.days[todayKey()]=(s.days[todayKey()]||0)+1;if(kind==='quiz')s.quiz=(s.quiz||0)+1;stSave(s);}
function markPerfect(id){const s=stLoad();s.badges=s.badges||{};s.badges[id]=1;stSave(s);}
function streak(){const s=stLoad();if(!s.days)return 0;let n=0,d=new Date();
  for(;;){const k=d.toISOString().slice(0,10);if(s.days[k]){n++;d.setDate(d.getDate()-1);}else break;}
  return n;}
/* ---- Setup badges (earned by completing a station's GUEST Ready check) ---- */
const STATION_BADGE={
  "coffee-station":"☕","carved-turkey":"🦃","carved-ham":"🍖","carved-flank":"🥩","carved-chicken":"🍗",
  "hot-dog-bar":"🌭","omelet":"🍳","eggs-benedict":"🥚","sundae-bar":"🍨","walking-cannoli":"🧁",
  "byo-bowl":"🥣","pasta-bowl":"🍝","rice-krispy":"🍡","sweet-savory":"🍫","place-setting":"🍽️"
};
function badgeEmoji(id){return STATION_BADGE[id]||'🏅';}
function hasBadge(id){const s=stLoad();return !!(s.badges&&s.badges[id]);}
function badgeCount(){const s=stLoad();return s.badges?Object.keys(s.badges).length:0;}
function renderBadges(){
  const earned=(stLoad().badges)||{};
  const all=STATIONS, got=all.filter(x=>earned[x.id]).length, pct=all.length?Math.round(got/all.length*100):0;
  const allDone=all.length>0&&got===all.length;
  const grid=all.map(x=>{const c=CATS[x.cat],on=!!earned[x.id];
    return `<div class="bdg${on?' on':''}" style="--bc:${c.color}" onclick="go('station','${x.id}')"><div class="bdgm">${badgeEmoji(x.id)}</div><div class="bdgn">${x.name}</div><div class="bdgc">${on?c.name:'Locked'}</div></div>`;}).join('');
  screen.innerHTML=`
   <p class="kicker">Service · Badges</p>
   <h1 class="disp">Setup Badges</h1>
   <p class="lead">Earn a badge each time you complete a station setup. ${allDone?'You collected them all — legend. 🏆':`Collect all ${all.length}.`}</p>
   <div class="bdgtop">${ringSVG(pct, allDone?'var(--displayed)':'var(--bar)')}<div><div class="bdgbig">${got} / ${all.length}</div><div class="bdgsub">stations completed</div></div></div>
   ${allDone?'<div class="famnote" style="border-color:var(--displayed)">🏆 Every station collected — you\'re a Puff setup master!</div>':''}
   <div class="bdggrid">${grid}</div>
   <div class="bcnote">Earn a station's badge by opening it and completing the <b>GUEST Ready check</b> — tick all five points. Badges save on this device (they'll follow your login once accounts are live).</div>
   <div class="rule">Dedication ~ Quality ~ Creativity</div>`;
  if(allDone){const s2=stLoad();if(!s2.badgeAllCel){s2.badgeAllCel=1;stSave(s2);setTimeout(()=>{const el=screen.querySelector('.bdgtop');if(el)celebrate(el,'ALL BADGES!');},250);}}
}
function confettiBurst(cx,cy){
  const cols=['#E2A9F1','#FF3131','#7ED957','#B8912E','#5170FF','#FF751F','#38B6FF'];
  for(let i=0;i<26;i++){const d=document.createElement('div');d.className='cfx';
    d.style.left=(cx+(Math.random()*150-75))+'px';d.style.top=(cy-8)+'px';
    d.style.background=cols[i%cols.length];
    d.style.transform='rotate('+(Math.random()*360)+'deg)';
    d.style.animation='cfall '+(0.9+Math.random()*0.9)+'s ease-in forwards';
    d.style.animationDelay=(Math.random()*0.18)+'s';
    document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}
}
function celebrate(container,label){
  const r=container.getBoundingClientRect();
  confettiBurst(r.left+r.width/2, Math.max(60,r.top+40));
  const st=document.createElement('div');st.className='stamp';st.textContent=label;container.appendChild(st);
}
const DAILY_POINTERS=[
  ["Regular on the Right","Always set Regular Coffee on the right side of the station — easy for team and guests to remember."],
  ["Red tape = out of service","Every event vehicle carries a roll — mark any damaged item so it never reaches a guest."],
  ["Match the linen to the table","You can't tell the size once it's folded — check the chart before you lay it."],
  ["Reds alone or with black","Whites & ivory only wash with their own. No exceptions."],
  ["Menu order = buffet order","The SEO item sequence is the buffet sequence, every time."]
];
function milestoneHTML(){
  const s=stLoad();if(!s.name)return '';
  return `<div class="milecard"><span class="mie">🎉</span><div class="miletext"><div class="mit">Happy 1 year with Puff, ${s.name}!</div><div class="mis">Thanks for a year of making events unforgettable.</div></div><span class="milesample">sample</span></div>`;
}
function greetingHTML(){
  const s=stLoad(),h=new Date().getHours();
  const part=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  if(s.name)return `<div class="greet">${part}, <b>${s.name}</b> 👋 <span class="grex" onclick="event.stopPropagation();clearName()" title="Not you?">✕</span></div>`;
  return `<div class="greet noname">${part} 👋 <input id="nameinput" class="nameinput" placeholder="add your first name" autocomplete="off" onkeydown="if(event.key==='Enter')saveName(this.value)"><button class="relchip" onclick="saveName(document.getElementById('nameinput').value)">Save</button></div>`;
}
function saveName(v){v=(v||'').trim().replace(/[<>]/g,'').slice(0,24);if(!v)return;const s=stLoad();s.name=v;stSave(s);render();}
function clearName(){const s=stLoad();delete s.name;stSave(s);render();}
function pctRole(k){const r=TRAINING[k];if(!r||!r.n)return 0;return Math.round(progFor(k,r.n)/r.n*100);}
function ringSVG(pct,color){
  const R=25,C=2*Math.PI*R,off=C*(1-pct/100);
  return `<svg viewBox="0 0 64 64" class="ringsvg"><circle cx="32" cy="32" r="${R}" fill="none" stroke="var(--hair)" stroke-width="6"/><circle cx="32" cy="32" r="${R}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" class="ringpct">${pct}%</text></svg>`;
}
function momentumHTML(){
  const s=stLoad(),st=streak();
  let top=null,topPct=-1,cert=0;
  ROLE_ORDER.forEach(k=>{const p=pctRole(k);if(p>=100)cert++;if(p>0&&p<100&&p>topPct){topPct=p;top=k;}});
  const chips=[];
  if(st>=2)chips.push('🔥 '+st+'-day streak');
  const bc=badgeCount();if(bc)chips.push('🏅 '+bc+'/'+STATIONS.length+' station badges');
  if(cert)chips.push('🎓 '+cert+' certification'+(cert>1?'s':''));
  if(s.quiz)chips.push('✓ '+s.quiz+' quiz wins');
  const chipsHTML=chips.length?`<div class="momo">${chips.map(c=>`<span class="mchip">${c}</span>`).join('')}</div>`:'';
  let card;
  if(top){const r=TRAINING[top],left=r.n-progFor(top,r.n),close=left<=3;
    card=`<div class="prog${close?' nudge':''}" onclick="go('role','${top}')">${ringSVG(topPct,close?'var(--bar)':'var(--displayed)')}<div class="progtext"><div class="pk">${close?'So close! 👀':'Your progress'}</div><div class="pn">${close?`${left} task${left>1?'s':''} from ${roleName(top)} certified`:`${topPct}% through ${roleName(top)} training`}</div><div class="ps">${close?'Finish it now →':`${left} tasks to certified · Continue →`}</div></div></div>`;
  }else if(cert){card=`<div class="prog" onclick="go('deliver')">${ringSVG(100,'var(--displayed)')}<div class="progtext"><div class="pk">Your progress</div><div class="pn">${cert} role${cert>1?'s':''} certified 🎓</div><div class="ps">Train another role · Deliver →</div></div></div>`;
  }else{card=`<div class="prog start" onclick="go('deliver')">${ringSVG(0,'var(--muted)')}<div class="progtext"><div class="pk">Your progress</div><div class="pn">Start your training</div><div class="ps">Pick your role in Deliver →</div></div></div>`;}
  return card+chipsHTML;
}
function fillHomeRec(){
  loadRecognition().then(d=>{const el=document.getElementById('homerec');
    if(!el||!d.entries||!d.entries.length)return;
    const nm=(stLoad().name||'').trim().toLowerCase().split(' ')[0];
    const mine=nm?d.entries.find(e=>(e.name||'').toLowerCase().split(' ')[0]===nm):null;
    if(mine){const t=(mine.text||'');
      el.innerHTML=`<div class="homerec foryou" onclick="go('elevate')"><div class="hrk">👏 For you${mine.cat?' · '+mine.cat:''}</div><div class="hrt">“${t.slice(0,150)}${t.length>150?'…':''}”</div><div class="hrn">Your Event Supervisor recognized you${mine.event?' · '+mine.event:''}</div></div>`;
    }else{const r=d.entries[0],t=(r.text||'');
      el.innerHTML=`<div class="homerec" onclick="go('elevate')"><div class="hrk">👏 Recognition${r.cat?' · '+r.cat:''}</div><div class="hrt">“${t.slice(0,130)}${t.length>130?'…':''}”</div><div class="hrn">${r.name||''}${r.event?' · '+r.event:''}</div></div>`;}
  });
}
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function dailyPointerHTML(avoid){
  let i=Math.floor(Date.now()/864e5)%DAILY_POINTERS.length;
  if(avoid&&norm(DAILY_POINTERS[i][0])===norm(avoid))i=(i+1)%DAILY_POINTERS.length;
  const P=DAILY_POINTERS[i];
  return `<div class="dk">✦ Pointer of the day</div><div class="dn">“${P[0]}”</div><div class="dv">${P[1]}</div>`;
}
function fillHomeFocus(){
  loadRecognition().then(d=>{const el=document.getElementById('homefocus');
    if(!el||!d.focus||!d.focus.title)return;
    const msg=(d.focus.msg||'');
    el.innerHTML=`<div class="daily tap" onclick="go('elevate')"><div class="dk">This week's focus</div><div class="dn">${d.focus.title}</div><div class="dv">${msg.slice(0,110)}${msg.length>110?'…':''}</div></div>`;
    const dp=document.getElementById('dailyptr'); if(dp)dp.innerHTML=dailyPointerHTML(d.focus.title);});
}


function openAdmin(){
  let ov=document.getElementById('adminov');
  if(!ov){
    ov=document.createElement('div');ov.id='adminov';
    ov.innerHTML='<div class="admbar"><span>Admin dashboard <em style="font-style:normal;color:#cfcabf;font-weight:400;font-size:11px">— design preview</em></span><button onclick="closeAdmin()">Close ✕</button></div><iframe id="admframe" title="Admin dashboard"></iframe>';
    document.body.appendChild(ov);
    document.getElementById('admframe').src='admin-dashboard.html';
  }
  ov.style.display='flex';
}
function closeAdmin(){const ov=document.getElementById('adminov');if(ov)ov.style.display='none';}
function toggle(el){const box=el.querySelector('input');setTimeout(()=>{
  el.classList.toggle('checked',box.checked);
  if(!box.checked)return;
  bump('task');
  const g=el.closest('.guest');
  if(g&&!g.dataset.done){
    const inputs=g.querySelectorAll('input');
    let all=true;inputs.forEach(i=>{if(!i.checked)all=false;});
    if(all){g.dataset.done='1';celebrate(g,g.dataset.stamp||'GUEST Ready ✦');
      const cur=stack[stack.length-1];
      if(cur&&cur.view==='station'&&cur.arg)markPerfect(cur.arg);}
  }
},0);}

document.getElementById('viewas').innerHTML=Object.keys(DEPTS).map(k=>`<option value="${k}">${DEPTS[k].label}</option>`).join('');
stack=[{view:'home'}];render();
</script>
