<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Passion to Perfection — Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,500;1,600;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Puff 'n Stuff brand palette (sampled from the Passion to Perfection deck) */
    --paper:#FEFFF9; --ink:#141310; --frame:#111010; --charcoal:#424242;
    --surround:#3B3B3B; --muted:#6A6A66; --hair:#E3E3E0; --panel:#FFFFFF;
    --soft:#F2F2F1; --soft2:#ECECEA; --hatchA:#F0F0EF; --hatchB:#E5E5E3;
    --buffet:#1800AD; --displayed:#7ED957; --chef:#FF3131; --dessert:#38B6FF;
    --coffee:#E2A9F1; --beverage:#5170FF; --bar:#FF751F; --place:#A6A6A6;
    --verified:#2E7D46; --review:#B9791A; --tbd:#8A8378; --gold:#B8912E;
    --serif:"Playfair Display",Georgia,"Times New Roman",serif;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--surround);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;}
  .phone{max-width:464px;margin:0 auto;min-height:100vh;background:var(--paper);
    box-shadow:0 0 46px rgba(0,0,0,.22);display:flex;flex-direction:column;position:relative;}

  /* Decorative black frame with corner accents */
  .frame{position:fixed;pointer-events:none;z-index:30;top:8px;bottom:8px;
    left:max(8px,calc(50% - 232px + 8px));right:max(8px,calc(50% - 232px + 8px));
    border:2.5px solid var(--frame);}
  .frame::before,.frame::after{content:"";position:absolute;width:20px;height:20px;}
  .corner{position:absolute;width:16px;height:16px;border:0;}
  .corner i{position:absolute;inset:0;}
  .corner i::before,.corner i::after{content:"";position:absolute;background:var(--frame);}
  .corner i::before{width:16px;height:1.5px;top:7px;left:0;transform:rotate(45deg);}
  .corner i::after{width:16px;height:1.5px;top:7px;left:0;transform:rotate(-45deg);}
  .c-tl{top:3px;left:3px}.c-tr{top:3px;right:3px}.c-bl{bottom:3px;left:3px}.c-br{bottom:3px;right:3px}

  /* Top bar */
  .topbar{position:sticky;top:0;z-index:20;background:var(--paper);
    border-bottom:2px solid var(--frame);display:flex;align-items:center;gap:11px;
    padding:11px 16px;min-height:58px;}
  .back{border:2px solid var(--frame);background:var(--paper);width:38px;height:38px;
    font-family:var(--serif);font-size:22px;line-height:1;cursor:pointer;display:none;
    align-items:center;justify-content:center;flex:none;color:var(--ink);}
  .back.show{display:flex;}
  .wm{font-family:var(--serif);line-height:1;}
  .wm .a{font-size:15px;font-weight:700;letter-spacing:.3px;}
  .wm .b{font-size:15px;font-weight:700;letter-spacing:.3px;margin-left:16px;position:relative;}
  .wm .b::before{content:"";position:absolute;left:-13px;top:-7px;width:9px;height:8px;
    border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);}
  .crumb{margin-left:auto;font-size:9.5px;letter-spacing:2px;text-transform:uppercase;
    color:var(--muted);text-align:right;font-weight:600;}

  .previewnote{background:var(--charcoal);color:#f2eee4;font-size:10.5px;line-height:1.45;
    padding:8px 16px;text-align:center;letter-spacing:.3px;}
  .previewnote b{color:#FEFFF9;}

  .screen{padding:20px 18px 26px;flex:1;animation:fade .18s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* Full wordmark lockup w/ stepped arrow */
  .lockup{text-align:center;margin:6px 0 4px;}
  .lockup .lk{display:inline-block;position:relative;text-align:left;font-family:var(--serif);}
  .lockup .p1{font-size:30px;font-weight:700;line-height:1;}
  .lockup .p2{font-size:30px;font-weight:700;line-height:1;margin-left:44px;margin-top:3px;}
  .lockup svg{position:absolute;left:6px;top:32px;width:150px;height:26px;overflow:visible;}
  .lockup .tag{display:block;text-align:center;font-family:var(--serif);font-style:italic;
    font-weight:500;font-size:14px;color:#4a463d;margin-top:10px;letter-spacing:.3px;}

  .kicker{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--muted);
    text-align:center;margin:14px 0 2px;}
  h1.disp{font-family:var(--serif);font-weight:800;font-size:25px;line-height:1.15;
    text-align:center;margin:2px 0 6px;letter-spacing:.2px;}
  .lead{color:var(--muted);font-size:13.5px;line-height:1.55;text-align:center;
    max-width:340px;margin:8px auto 4px;}

  /* Section title block (solid color, black border, bold serif) */
  .titleblock{border:2.5px solid var(--frame);background:var(--tbcolor,#eee);
    padding:11px 14px;margin:0;display:flex;align-items:center;gap:12px;}
  .titleblock .tbtext{font-family:var(--serif);font-weight:800;text-transform:uppercase;
    font-size:20px;letter-spacing:.5px;color:#151312;line-height:1.05;}
  .titleblock .tbtext small{display:block;font-size:11px;font-weight:600;letter-spacing:1px;
    text-transform:none;font-family:var(--sans);color:#2c2823;margin-top:2px;font-style:normal;}
  .diamond{width:17px;height:17px;background:var(--dc,#999);border:2px solid var(--frame);
    transform:rotate(45deg);flex:none;}

  /* Path nodes (home) */
  .arc{display:flex;flex-direction:column;gap:11px;margin-top:20px;}
  .node{border:2.5px solid var(--frame);background:var(--panel);padding:15px 15px;
    display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .12s;}
  .node:active{transform:scale(.985);}
  .node .num{font-family:var(--serif);font-style:italic;font-size:23px;font-weight:700;
    width:32px;text-align:center;flex:none;color:var(--ink);}
  .node .nt{font-family:var(--serif);font-size:19px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;}
  .node .ns{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .node .go{margin-left:auto;font-family:var(--serif);font-size:24px;flex:none;}
  .node.active{box-shadow:5px 5px 0 var(--frame);}
  .node.planned{background:repeating-linear-gradient(45deg,var(--hatchA),var(--hatchA) 7px,var(--hatchB) 7px,var(--hatchB) 14px);
    border-style:dashed;cursor:default;}
  .node.planned .nt,.node.planned .num{color:#5c574c;}

  /* Badges */
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:700;
    letter-spacing:1px;text-transform:uppercase;padding:3.5px 8px;border:1.5px solid;
    white-space:nowrap;font-family:var(--sans);}
  .b-plan{color:var(--muted);border-color:#BFBDB6;background:#fff;}
  .b-active{color:#fff;border-color:var(--charcoal);background:var(--charcoal);}
  .b-verified{color:#fff;border-color:var(--frame);background:var(--frame);}
  .b-review{color:#2b2926;border-color:#2b2926;background:#fff;}
  .b-tbd{color:var(--muted);border-color:#BFBDB6;background:var(--soft);}
  .mini{margin-left:auto;flex:none;}

  /* Craft grid */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px;}
  .tile{border:2.5px solid var(--frame);background:var(--panel);padding:13px;min-height:92px;
    display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;position:relative;
    transition:transform .12s;}
  .tile:active{transform:scale(.98);}
  .tile .tt{font-family:var(--serif);font-size:16px;font-weight:800;letter-spacing:.2px;}
  .tile .td{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.35;}
  .tile.active{box-shadow:4px 4px 0 var(--frame);}
  .tile.planned{background:repeating-linear-gradient(45deg,var(--hatchA),var(--hatchA) 7px,var(--hatchB) 7px,var(--hatchB) 14px);
    border-style:dashed;cursor:default;}
  .tile.planned .tt{color:#5c574c;}
  .tile .badge{align-self:flex-start;margin-top:8px;}

  /* Station list rows */
  .cathead{display:flex;align-items:center;gap:10px;margin:24px 0 11px;}
  .cathead .catname{font-family:var(--serif);font-size:13px;font-weight:800;letter-spacing:2px;
    text-transform:uppercase;}
  .row{border:2.5px solid var(--frame);background:var(--panel);padding:0;margin-bottom:11px;
    display:flex;align-items:stretch;cursor:pointer;transition:transform .12s;overflow:hidden;}
  .row:active{transform:scale(.99);}
  .row .cbar{width:12px;flex:none;background:var(--rc);border-right:2px solid var(--frame);}
  .row .rin{padding:12px 14px;display:flex;align-items:center;gap:12px;flex:1;}
  .row .rt{font-family:var(--serif);font-size:16px;font-weight:800;line-height:1.15;}
  .row .rd{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.35;}
  .row .go{margin-left:auto;font-family:var(--serif);font-size:22px;flex:none;color:var(--muted);}

  /* Station detail */
  .photoph{border:2.5px solid var(--frame);background:var(--soft2);height:158px;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);
    text-align:center;padding:10px;margin-top:0;border-top:none;}
  .photoph .ic{font-size:30px;opacity:.5;}
  .photoph .t1{font-family:var(--serif);font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;}
  .photoph .t2{font-size:10.5px;}
  /* Photo gallery (swipe / scroll multiple photos) */
  .gallery{position:relative;}
  .gtrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border:2.5px solid var(--frame);-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .gtrack::-webkit-scrollbar{display:none;}
  .gslide{min-width:100%;scroll-snap-align:center;height:196px;position:relative;flex:none;}
  .gslide img{width:100%;height:100%;object-fit:cover;display:block;}
  .gslide.gph{background:var(--soft2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);text-align:center;padding:12px;}
  .gslide .ic{font-size:30px;opacity:.5;}
  .gslide .t1{font-family:var(--serif);font-size:11.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;}
  .gslide .t2{font-size:10.5px;}
  .gcap{position:absolute;left:0;right:0;bottom:0;background:rgba(17,16,13,.72);color:#fff;font-size:11px;padding:5px 9px;font-weight:600;}
  .garrow{position:absolute;top:80px;width:32px;height:32px;border:2px solid var(--frame);background:var(--paper);font-family:var(--serif);font-size:19px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);z-index:2;}
  .gprev{left:7px;} .gnext{right:7px;}
  .gdots{display:flex;justify-content:center;gap:8px;margin-top:9px;}
  .gdot{width:8px;height:8px;border:1.5px solid var(--frame);transform:rotate(45deg);background:transparent;}
  .gdot.on{background:var(--frame);}
  .gcount{text-align:center;font-size:10px;color:var(--muted);margin-top:6px;letter-spacing:.3px;}
  .statusrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;}

  .block{border:2px solid var(--frame);background:var(--panel);padding:13px 15px;margin-top:14px;}
  .block .bh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .block .bt{font-family:var(--serif);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;}
  .concept{font-size:13.5px;line-height:1.55;}
  .concept .dish{font-family:var(--serif);font-weight:800;font-size:15px;}
  .muted{color:var(--muted);}
  .famnote{font-size:11.5px;color:var(--muted);font-style:italic;font-family:var(--serif);
    margin-top:8px;padding-left:11px;border-left:2px solid var(--hair);line-height:1.45;}

  .checkline{display:flex;align-items:flex-start;gap:11px;padding:8px 0;border-bottom:1px solid var(--hair);
    font-size:13.5px;line-height:1.4;}
  .checkline:last-child{border-bottom:none;}
  .checkline input{margin-top:1px;width:18px;height:18px;flex:none;accent-color:var(--verified);}
  .checkline.checked span{text-decoration:line-through;color:var(--muted);}
  .qty{font-weight:700;font-variant-numeric:tabular-nums;}
  /* Guest-count scaling control */
  .gcbar{border:2px solid var(--frame);background:#FCFCFB;padding:11px 12px;margin-bottom:13px;}
  .gclabel{font-family:var(--serif);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .gcrow{display:flex;align-items:center;gap:12px;}
  .gcrow input[type=range]{flex:1;accent-color:var(--charcoal);height:22px;}
  .gcval{font-family:var(--serif);font-weight:800;font-size:15px;min-width:82px;text-align:right;}
  .gchint{font-size:10.5px;color:var(--muted);margin-top:10px;line-height:1.5;}
  .qrule{display:inline-block;font-size:8.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);border:1px solid var(--hair);padding:1px 5px;margin-left:6px;white-space:nowrap;}
  .qrule.cf{color:var(--review);border-color:var(--review);}

  /* Perfecting Pointer — deck style: color panel, black border, star, italic serif label */
  .pointer{border:2.5px solid var(--frame);padding:13px 15px;margin-top:16px;background:var(--pc,#eee);}
  .pointer .pl{font-family:var(--serif);font-style:italic;font-weight:700;font-size:16px;
    display:flex;align-items:center;gap:8px;margin-bottom:6px;color:#141310;}
  .pointer .star{color:var(--gold);font-style:normal;font-size:16px;}
  .pointer .pv{font-size:13px;line-height:1.5;color:#171512;}
  .pointer .pv u{text-underline-offset:3px;}
  .pointer.tbd{background:var(--soft);border-style:dashed;}
  .pointer.tbd .pl,.pointer.tbd .pv{color:var(--muted);}

  /* GUEST ready */
  .guest{border:2.5px solid var(--frame);background:#FCFCFB;padding:15px;margin-top:16px;}
  .guest .gh{font-family:var(--serif);font-size:17px;font-weight:800;text-align:center;margin-bottom:2px;}
  .guest .gsub{font-size:10.5px;color:var(--muted);text-align:center;margin-bottom:12px;
    display:flex;flex-direction:column;align-items:center;gap:7px;}
  .gitem{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--hair);}
  .gitem input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--verified);}
  .gL{font-family:var(--serif);font-weight:800;font-size:22px;width:24px;flex:none;color:var(--chef);line-height:1;}
  .gT{font-size:13.5px;font-weight:700;}
  .gD{font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.4;}
  .gitem.checked .gT{text-decoration:line-through;color:var(--muted);}

  .tbdbox{border:1.5px dashed #BFBDB6;background:var(--soft);color:var(--muted);padding:11px 13px;
    margin-top:14px;font-size:12px;line-height:1.45;}
  .tbdbox b{color:#5c574c;}
  .note-inline{font-size:11.5px;color:var(--muted);background:var(--soft);border:1px solid var(--hair);
    padding:10px 12px;margin:14px 0 2px;line-height:1.5;}
  .note-inline b{color:#4a463d;}

  /* Puff 'n Stuff logo block */
  .logoblock{background:var(--charcoal);margin:24px -18px -26px;padding:20px;text-align:center;}
  .logoblock .pflogo{width:64%;max-width:220px;height:auto;display:block;margin:0 auto;}
  .logoblock .pf{font-family:var(--serif);color:#fff;font-size:26px;font-weight:700;letter-spacing:.5px;}
  .logoblock .pf sup{font-size:13px;font-style:italic;}
  .logoblock .ec{color:#cfcabf;font-size:9px;letter-spacing:5px;text-transform:uppercase;margin-top:3px;}

  .rule{text-align:center;font-family:var(--serif);font-style:italic;font-size:12.5px;
    color:var(--muted);margin-top:20px;letter-spacing:.5px;}

  /* GUEST Ready standard page */
  .gintro{border:2.5px solid var(--frame);background:var(--charcoal);color:#f6f5f0;
    padding:16px 17px;margin-top:14px;font-size:13px;line-height:1.55;}
  .gintro .q{font-family:var(--serif);font-style:italic;font-weight:700;font-size:20px;
    text-align:center;margin-top:9px;color:#fff;}
  .guestcard{border:2px solid var(--frame);background:var(--panel);padding:13px 14px;
    margin-top:12px;display:flex;gap:14px;align-items:flex-start;}
  .gcL{font-family:var(--serif);font-weight:900;font-size:24px;color:#fff;background:var(--charcoal);
    width:42px;height:42px;flex:none;display:flex;align-items:center;justify-content:center;
    border:2px solid var(--frame);}
  .gcT{font-family:var(--serif);font-size:16px;font-weight:800;letter-spacing:.2px;}
  .gcLead{font-size:12.5px;color:var(--muted);margin:3px 0 8px;font-family:var(--serif);font-style:italic;}
  .gcBul{list-style:none;margin:0;padding:0;}
  .gcBul li{font-size:13px;padding:3px 0 3px 17px;position:relative;line-height:1.4;}
  .gcBul li::before{content:"◆";position:absolute;left:0;top:5px;font-size:8px;color:var(--ink);}

  /* Philosophy path rows */
  .pathrow{padding:9px 0;border-bottom:1px solid var(--hair);}
  .pathrow:last-child{border-bottom:none;}
  .pathrow .pw{font-family:var(--serif);font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.5px;}
  .pathrow .ps{font-family:var(--serif);font-size:14px;color:var(--muted);}
  .pathrow .pd{font-size:12px;color:var(--muted);margin-top:2px;}
  /* Core Values cards */
  .valwrap{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .valcard{border:2px solid var(--frame);background:var(--panel);padding:13px 14px;
    display:flex;align-items:flex-start;gap:13px;}
  .valnum{font-family:var(--serif);font-style:italic;font-weight:700;font-size:18px;width:30px;height:30px;
    flex:none;border:2px solid var(--frame);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .valname{font-family:var(--serif);font-weight:800;font-size:17px;letter-spacing:.2px;}
  .valdesc{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45;}
  .valdesc .confirm{color:var(--review);font-style:italic;font-size:11px;}
</style>
</head>
<body>
<div class="frame"><span class="corner c-tl"><i></i></span><span class="corner c-tr"><i></i></span><span class="corner c-bl"><i></i></span><span class="corner c-br"><i></i></span></div>
<div class="phone">
  <div class="previewnote"><b>INTERNAL PREVIEW · Puff 'n Stuff — not for distribution</b><br>Concept direction for review · verified content is badged · other sections are placeholders</div>
  <div class="topbar">
    <button class="back" id="backBtn" aria-label="Back">‹</button>
    <div class="wm"><span class="a">Passion to</span><span class="b">Perfection</span></div>
    <div class="crumb" id="crumb"></div>
  </div>
  <div class="screen" id="screen"></div>
</div>

<script>
/* ---------- Verified content (sourced from the Passion to Perfection deck) ---------- */
const CATS = {
  coffee:   {name:"Coffee Station",     color:"var(--coffee)"},
  chef:     {name:"Chef Action Station",color:"var(--chef)"},
  displayed:{name:"Displayed Station",  color:"var(--displayed)"}
};

const GUEST = [
  ["G","Guest First","“If I were the guest, what would I notice first?” Inviting, intuitive, welcoming."],
  ["U","Uniform & Uncluttered","Everything intentional. Clean lines, labels facing forward, no boxes, trash, or extra equipment visible."],
  ["E","Equipped","Everything needed is already there. Utensils in place, fuel ready, glassware polished."],
  ["S","Safe & Stocked","Ready for service. Food safety, no trip hazards, fully stocked before guests arrive."],
  ["T","Trustworthy","The guest can trust us without thinking. Nothing missing, broken, or dirty — every detail says professional."]
];
// Full framework copy (verbatim from the deck) for the standalone GUEST Ready standard page
const GUEST_DETAIL = [
  ["G","Guest First","“If I were the guest, what would I notice first?”",["Is it inviting?","Is it intuitive?","Is it welcoming?"]],
  ["U","Uniform & Uncluttered","Everything looks intentional.",["Clean lines","Labels facing forward","No boxes, trash, or extra equipment visible"]],
  ["E","Equipped","Everything needed is already there.",["Utensils in place","Fuel ready","Glassware polished"]],
  ["S","Safe & Stocked","The station is ready for service.",["Food safety","No trip hazards","Fully stocked before guests arrive"]],
  ["T","Trustworthy","The guest can trust us without thinking about it.",["Nothing missing","Nothing broken or dirty","Every detail says “professional.”"]]
];

function carved(knife){return [
  ["50",'8" Square Plates'],["50","Salad Forks"],["50",knife],
  ["1","Heat Lamp"],["1","Carving Board"],["1","Extension Cord"],["1","Roll Black Gaffing Tape"],
  ['2','Tongs 9"'],['2','Small Tongs 7"'],["4","Underliner Plates"],["1","Platter for Flatware"],
  ["1","Box white square beverage napkins"],["–","Menu Cards in Holder"],
  ["2","Sets of (3) votive candles"],["1","Slim Jim with Cover"],["2","Garbage Bags"]

const screen=document.getElementById('screen');
const backBtn=document.getElementById('backBtn');
const crumb=document.getElementById('crumb');
let stack=[];
function go(view,arg){stack.push({view,arg});render();window.scrollTo(0,0);}
function back(){if(stack.length>1){stack.pop();render();window.scrollTo(0,0);}}
backBtn.onclick=back;
function badge(k,l){return `<span class="badge b-${k}">${l}</span>`;}

function render(){
  const cur=stack[stack.length-1];
  backBtn.classList.toggle('show',stack.length>1);
  const map={home:'',build:'Build',service:'Build · Service',station:'Build · Service',know:'Know',guest:'Know · GUEST Ready',philosophy:'Know · Philosophy',values:'Know · Core Values'};
  crumb.textContent=map[cur.view]||'';
  ({home:renderHome,build:renderBuild,service:renderService,station:()=>renderStation(cur.arg),know:renderKnow,guest:renderGuest,philosophy:renderPhilosophy,values:renderValues})[cur.view]();
}

const G0=50;
function ruleTag(r){return {g:'per guest','pct25':'25% of guests','cap25':'1 per 25 guests'}[r]||null;}
function scaleQty(base,rule,g){
  const n=parseInt(base,10); if(isNaN(n))return base;
  if(rule==='g')return Math.max(1,Math.round(n*g/G0));
  if(rule==='pct25')return Math.max(1,Math.ceil(g*0.25));
  if(rule==='cap25')return Math.max(1,Math.ceil(g/25));
  return n;
}
function onGuest(input){
  const g=parseInt(input.value,10);
  const box=input.closest('.block');
  const val=box.querySelector('.gcval'); if(val)val.textContent=g+' guests';
  box.querySelectorAll('.qty[data-rule]').forEach(q=>{q.textContent='('+scaleQty(q.dataset.base,q.dataset.rule,g)+')';});
}
const PHOTO_VIEWS=["Full station view","Detail / placement","Guest-facing angle"];
function galleryHTML(s){
  const photos=(s.photos&&s.photos.length)?s.photos:PHOTO_VIEWS.map(v=>({label:v}));
  const slides=photos.map(p=>p.src
    ? `<div class="gslide"><img src="${p.src}" alt="${p.label||''}">${p.label?`<div class="gcap">${p.label}</div>`:''}</div>`
    : `<div class="gslide gph"><div class="ic">◈</div><div class="t1">What Good Looks Like</div><div class="t2">${p.label} — photo needed</div></div>`
  ).join('');
  const multi=photos.length>1;
  const dots=photos.map((p,i)=>`<span class="gdot${i===0?' on':''}"></span>`).join('');
  return `<div class="gallery">
    <div class="gtrack" id="gtrack">${slides}</div>
    ${multi?`<button class="garrow gprev" aria-label="Previous photo">‹</button><button class="garrow gnext" aria-label="Next photo">›</button>`:''}
    ${multi?`<div class="gdots">${dots}</div><div class="gcount"><span id="gcur">1</span> / ${photos.length} · swipe or tap ‹ ›</div>`:''}
  </div>`;
}
function initGallery(){
  const track=document.getElementById('gtrack');if(!track)return;
  const dots=[].slice.call(screen.querySelectorAll('.gdot'));
  const cur=document.getElementById('gcur');
  function update(){const i=Math.round(track.scrollLeft/track.clientWidth);dots.forEach((d,k)=>d.classList.toggle('on',k===i));if(cur)cur.textContent=i+1;}
  track.addEventListener('scroll',()=>window.requestAnimationFrame(update));
  const p=screen.querySelector('.gprev'),n=screen.querySelector('.gnext');
  if(p)p.onclick=()=>track.scrollBy({left:-track.clientWidth,behavior:'smooth'});
  if(n)n.onclick=()=>track.scrollBy({left:track.clientWidth,behavior:'smooth'});
}
function renderStation(id){
  const s=STATIONS.find(x=>x.id===id);const c=CATS[s.cat];
  const dyn=!!s.dynamic;
  const equipItems=s.equip.map(e=>{
    const base=e[0], rule=e[2], num=parseInt(base,10);
    const showQ=(dyn&&!isNaN(num))?scaleQty(base,rule,G0):base;
    const rt=ruleTag(rule);
    const tag=dyn?(rt?`<span class="qrule">${rt}</span>`:(rule==='?'?`<span class="qrule cf">confirm rule</span>`:'')):'';
    const attr=(dyn&&!isNaN(num)&&rt)?` data-base="${base}" data-rule="${rule}"`:'';
    return `<label class="checkline" onclick="toggle(this)"><input type="checkbox"><span><span class="qty"${attr}>(${showQ})</span> ${e[1]}${tag}</span></label>`;
  }).join('');
  const guestCtrl=dyn?`<div class="gcbar">
      <div class="gclabel"><span>Scale to guest count</span>${badge('review','Draft rules')}</div>
      <div class="gcrow"><input type="range" min="10" max="300" step="5" value="50" oninput="onGuest(this)" aria-label="Guest count"><span class="gcval">50 guests</span></div>
      <div class="gchint">Items tagged <span class="qrule">per guest</span>, <span class="qrule">25% of guests</span> or <span class="qrule">1 per 25 guests</span> recalculate live. Items marked <span class="qrule cf">confirm rule</span> need a scaling rule from Operations.</div>
    </div>`:'';
  const guestItems=GUEST.map(g=>`
    <label class="gitem" onclick="toggle(this)"><input type="checkbox">
      <span class="gL" style="color:${c.color}">${g[0]}</span>
      <span><span class="gT">${g[1]}</span><span class="gD">${g[2]}</span></span></label>`).join('');
  const pointer=s.pointer.v
    ? `<div class="pointer" style="--pc:${c.color}"><div class="pl"><span class="star">✦</span> Perfecting Pointer ${badge('verified','Verified')}</div><div class="pv">${s.pointer.text}</div></div>`
    : `<div class="pointer tbd"><div class="pl"><span class="star">✦</span> Perfecting Pointer ${badge('tbd','TBD')}</div><div class="pv">No verified pointer for this station yet. <b>Requires Operations verification</b> — the deck's default "Regular on the Right" is a Coffee Station pointer only.</div></div>`;
  screen.innerHTML=`
    <div class="titleblock" style="--tbcolor:${c.color}">
      <span class="diamond" style="--dc:var(--paper)"></span>
      <span class="tbtext">${s.name}<small>${c.name}</small></span>
    </div>
    ${galleryHTML(s)}
    <div class="statusrow">${badge(s.status[0],s.status[1])}${badge('tbd','Legacy source')}</div>

    ${s.concept?`<div class="block"><div class="bh"><span class="bt">Concept / Menu</span>${badge('verified','From deck')}</div><div class="concept">${s.concept.replace(/^([^—]+)—/,'<span class="dish">$1</span> — ')}</div></div>`:''}
    ${s.family?`<div class="famnote">${s.family}</div>`:''}

    <div class="block"><div class="bh"><span class="bt">Purpose</span>${badge('tbd','TBD')}</div>
      <div class="concept muted">One-line purpose to confirm with Operations.</div></div>

    <div class="block"><div class="bh"><span class="bt">Equipment / Pull List</span>${badge(s.equipStatus[0],s.equipStatus[1])}</div>${guestCtrl}${equipItems}</div>

    <div class="block"><div class="bh"><span class="bt">Setup Steps</span>${badge('tbd','TBD')}</div>
      <div class="concept muted">Ordered setup steps not yet supplied. <b style="color:#5c574c">Requires Operations verification.</b></div></div>

    ${pointer}

    <div class="guest"><div class="gh">Is the station GUEST ready?</div>
      <div class="gsub"><span>Run every point before you step away</span>${badge('verified','Verified framework')}</div>
      ${guestItems}</div>

    <div class="tbdbox"><b>During Service &amp; Breakdown:</b> not yet documented for this station — placeholders in the content model, pending Operations.</div>
    <div class="rule">Dedication ~ Quality ~ Creativity</div>
  `;
  initGallery();
}

  ];
  screen.innerHTML=`
    <p class="kicker">Know the Standard</p>
    <h1 class="disp">Know the Standard</h1>
    <p class="lead">The shared foundation every team member works from. <b>Philosophy, Core Values</b> and <b>GUEST Ready</b> are built out for this preview.</p>
    <div class="arc">
      ${items.map(it=>it[2]
        ? `<div class="node active" onclick="go('${it[3]}')"><div class="num">◆</div><div><div class="nt">${it[0]}</div><div class="ns">${it[1]}</div></div><span class="go">›</span></div>`
        : `<div class="node planned"><div class="num">◇</div><div><div class="nt">${it[0]}</div><div class="ns">${it[1]}</div></div><span class="badge b-plan mini">Planned</span></div>`
      ).join('')}
    </div>
    <div class="note-inline">Mirrors Kat's mockup for <b>Know the Standard</b>. Only GUEST Ready has verified content today, so the other items are shown as planned.</div>
  `;
}

function renderGuest(){
  const cards=GUEST_DETAIL.map(g=>`
    <div class="guestcard">
      <div class="gcL">${g[0]}</div>
      <div><div class="gcT">${g[1]}</div><div class="gcLead">${g[2]}</div>
        <ul class="gcBul">${g[3].map(b=>`<li>${b}</li>`).join('')}</ul></div>
    </div>`).join('');
  screen.innerHTML=`
    <div class="titleblock" style="--tbcolor:var(--charcoal)">
      <span class="diamond" style="--dc:var(--paper)"></span>
      <span class="tbtext" style="color:#fff">GUEST Ready<small style="color:#e6e4df">The five-point readiness standard</small></span>
    </div>
    <div class="statusrow">${badge('verified','Verified')}${badge('tbd','From deck')}</div>
    <div class="gintro">
      <div>Every decision we make while on an event should improve the guest experience. Before every event, ask yourself one question…</div>
      <div class="q">Are we GUEST Ready?</div>
    </div>
    <div class="note-inline" style="margin-top:14px">Check that each <b>station, bar, beverage station, placesetting, and linen</b> meets all five points before guests arrive.</div>
    ${cards}
    <div class="tbdbox" style="border-style:solid;border-color:var(--frame)"><b>On every station page</b>, these five points appear as an interactive checklist you run before stepping away.</div>
    <div class="rule">Dedication ~ Quality ~ Creativity</div>
  `;
}

function renderPhilosophy(){
  const path=[
    ["Know","the Standard","Learn what good looks like."],
    ["Build","the Skill","Practice it until it's second nature."],
    ["Elevate","the Experience","Add the details guests remember."],
    ["Deliver","Perfection","Execute it, every event."]
  ];
  screen.innerHTML=`
    <div class="titleblock" style="--tbcolor:var(--charcoal)">
      <span class="diamond" style="--dc:var(--paper)"></span>
      <span class="tbtext" style="color:#fff">Philosophy<small style="color:#e6e4df">The Puff 'n Stuff Standard</small></span>
    </div>
    <div class="statusrow">${badge('verified','Verified')}${badge('tbd','From deck')}</div>
    <div class="gintro"><div class="q" style="margin-top:0">Every decision we make while on an event should improve the guest experience.</div></div>
    <div class="block" style="margin-top:14px"><div class="bh"><span class="bt">The Path to Perfection</span>${badge('verified','From deck')}</div>
      ${path.map(p=>`<div class="pathrow"><span class="pw">${p[0]}</span> <span class="ps">${p[1]}</span><div class="pd">${p[2]}</div></div>`).join('')}
    </div>
    <div class="pointer" style="--pc:var(--charcoal);color:#fff">
      <div class="pv" style="color:#f6f5f0;font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.6">
        We don't just set tables, prepare stations, or serve meals.<br>
        We create experiences that become cherished memories.<br>
        Every detail matters. Every guest matters. Every celebration matters.</div>
    </div>
    <div class="rule">Dedication ~ Quality ~ Creativity</div>
  `;
}

function renderValues(){
  const vals=[
    ["Hospitality","Welcome every guest with genuine warmth and grace.",false],
    ["Creativity","Bring innovation and artistry to every event and design.",false],
    ["Celebration","Bring joy and meaningful connection to every occasion we create.",false],
    ["Culinary Mastery","Continue our bold passion and strive to craft extraordinary cuisine.",true],
    ["Excellence","Uphold the highest standards in taste, presentation, and service.",false],
    ["Trust","Deliver on every promise with integrity, consistency, and transparency.",false],
    ["Personalization","Tailor every element to reflect the client's unique vision and style.",false],
    ["Seamless Service","Execute flawlessly so clients can relax and enjoy their moment.",false]
  ];
  screen.innerHTML=`
    <div class="titleblock" style="--tbcolor:var(--charcoal)">
      <span class="diamond" style="--dc:var(--paper)"></span>
      <span class="tbtext" style="color:#fff">Brand Values<small style="color:#e6e4df">These values define Puff 'n Stuff's essence</small></span>
    </div>
    <div class="statusrow">${badge('verified','Verified')}${badge('tbd','Brand Guidelines · 2023')}</div>
    <div class="valwrap">
      ${vals.map((v,i)=>`<div class="valcard"><span class="valnum">${i+1}</span><div><div class="valname">${v[0]}</div><div class="valdesc">${v[1]}${v[2]?' <em class="confirm">(confirm wording)</em>':''}</div></div></div>`).join('')}
    </div>
    <div class="rule">Dedication ~ Quality ~ Creativity</div>
  `;
}

function toggle(el){const box=el.querySelector('input');setTimeout(()=>{el.classList.toggle('checked',box.checked);},0);}

stack=[{view:'home'}];render();
</script>
</body>
</html>
